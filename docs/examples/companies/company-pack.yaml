# CSEF company pack: Acme Learning
# Generated by the CSEF policy questionnaire (tooling/policy.py). To change it, run the
# questionnaire again with answers.json rather than editing this file by hand.
#
# Use in a product repository:
#   1. Copy this file to .csef/packs/acme.yaml
#   2. In csef.yaml:  jurisdictions: [EU, PT]
#                     packs: [.csef/packs/acme.yaml]
#   3. Run the scanner, the GitHub Action or the csef-review skill as usual.
#
# Validate: python3 tooling/build.py --validate-pack acme.yaml

pack:
  id: acme
  title: Acme Learning child-safety policy
  jurisdiction: ORG
  version: 1.0.0
  date: '2026-11-19'
  maintainer: 'Acme Learning: CEO'
  status: 'In force for: All Acme games and apps for primary and lower secondary schools'
  url: null
  generated_by: csef-policy 0.14.0 from answers.json
parameters:
  owner: CEO
  waiver_approvers: the Data Protection Officer or the CEO
  waiver_max_days: 90
  contact: the Data Protection Officer (privacy@acme.example)
  scope: All Acme games and apps for primary and lower secondary schools
  profiles:
  - A
  - C
  age_bands:
  - B2
  - B3
  features:
  - accounts
  - multiplayer
  - chat
  - streaks
  - leaderboards
  - notifications
  - ai_generative
  - assessment
  jurisdictions:
  - EU
  - PT
policy:
  minimum_level: 2
  no_go:
  - CORE-COM-01     # Advertising or ad tracking shown to children
  - CORE-COM-07     # Advertising or ad tracking shown to children
  - A-ECO-01        # Paid random rewards (loot boxes, paid card packs, gacha)
  - A-ECO-02        # Paying to win, skip learning or get ahead of others
  - A-ECO-03        # Virtual coins or gems that children can buy
  - C-ENG-03        # Virtual coins or gems that children can buy
  - CORE-COM-08     # Brands, sponsors or product placement inside learning activities
  - CORE-COM-03     # Pressure design (countdowns, fake scarcity, guilt messages, pre-ticked boxes)
  - A-PLY-01        # Penalties for not playing (decay, energy timers, losing progress)
  - CORE-SAF-05     # Contact from people outside the child's class or group
  - CORE-CHT-04     # Free-text chat between children
  - CORE-CHT-05     # Free-text chat between children
  - AGE-B2-01       # Free-text chat between children
  - CORE-CHT-06     # Voice chat, video or live streaming
  - CORE-AI-01      # Emotion recognition (AI reading feelings from faces, voice or behaviour)
  - CORE-AI-06      # AI characters that act like a friend or remember conversations
  - CORE-AI-08      # AI characters that act like a friend or remember conversations
  - CORE-AI-04      # Training AI models on children's data
  - CORE-DAT-08     # Face, voice or fingerprint identification, webcam proctoring
  - B-EVL-02        # Face, voice or fingerprint identification, webcam proctoring
  - CORE-DAT-02     # Sharing children's data with a company without a signed agreement
  - CORE-DAT-07     # Real children's data in development, testing or demos
  - CORE-COM-02     # Session recording, heatmaps or third-party analytics on child screens
  - CORE-DAT-04     # Session recording, heatmaps or third-party analytics on child screens
  - CORE-DAT-09     # Collecting children's location
  - CORE-SEC-02     # Learner data readable without access rules (e.g. open database tables)
  forbid_dependencies:
  - '@hotjar/browser'
  - react-hotjar
  - '@fullstory/browser'
  - '@fullstory/react-native'
  - '@microsoft/clarity'
  - logrocket
  - logrocket-react
  - smartlook-client
  - smartlook-react-native-wrapper
  - '@fingerprintjs/fingerprintjs'
  - '@fingerprintjs/fingerprintjs-pro'
  - clientjs
  forbid_phrases:
  - lose your streak
  - don't break your streak
  - we miss you
  - your friends are waiting
  - last chance
  - only a few left
  - hurry up
  - don't miss out
  - come back and play
  - before it's too late
  - perdes a tua sequência
  - não quebres a sequência
  - temos saudades tuas
  - os teus amigos estão à tua espera
  - última oportunidade
  - só restam
  - despacha-te
  - não percas
  - volta a jogar
  - antes que seja tarde
  require_decision_for_features:
  - streaks
  - notifications
  - leaderboards
  - ai_generative
  - assessment
  review_every_days: 180
  require_agent_instructions: true
rules:
- id: ACME-OWN-01
  title: Teachers can switch off every game element for their class.
  level: MUST
  tier: 1
  profiles:
  - core
  age_bands:
  - all
  requirement: Teachers can switch off every game element for their class.
  rationale: Acme Learning red line, set in the CSEF questionnaire.
  improvement: Check in every review. If a product needs an exception, ask the Data Protection Officer or the CEO.
  effort: low
  sources:
  - ACME-POLICY
  detection:
    method: manual
