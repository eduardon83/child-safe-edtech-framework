# Copy to .github/workflows/cses-check.yml in your product repository.
# Pin the tag of the standard you follow.
name: CSES child-safety check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # for SARIF upload to code scanning

jobs:
  cses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: eduardon83/child-safe-edtech-standards@v0.5.0
        with:
          fail-on: block        # block | review | warn | never
          export: html,pdf,docx # dashboard.html, report.pdf, report.docx in the cses-report artifact
          # level: 2            # override compliance_level from cses.yaml
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: cses-report/findings.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cses-report
          path: cses-report/
