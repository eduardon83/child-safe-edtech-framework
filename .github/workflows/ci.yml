name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest python-docx
      - name: Validate catalogue and check generated files
        run: python3 tooling/build.py --check
      - name: Validate example company pack
        run: python3 tooling/build.py --validate-pack examples/company-packs/acme.yaml
      - name: Tests
        run: python3 -m pytest -q
      - name: Scan the compliant example (must pass at level 3)
        run: python3 tooling/scan.py --repo examples/compliant-game --level 3 --fail-on review
      - name: Export example dashboard, PDF and Word
        run: |
          python3 tooling/scan.py --repo examples/noncompliant-game --out-dir dist/example --format none --export html,pdf,docx || true
          ls dist/example
      - name: Compare example code of conduct
        run: python3 tooling/coc.py --input examples/codes-of-conduct/example-code.md --level 2 --out-dir dist/example-coc
      - name: Literacy Compass example
        run: python3 tooling/compass.py --input examples/compass/fact-quest --manifest examples/compass/fact-quest/csef.yaml --csef-findings dist/example/findings.json --out-dir dist/example-compass
      - name: Serious-game pre-check and label package example
        run: |
          python3 tooling/precheck.py --repo examples/compliant-game --out-dir dist/example-precheck
          python3 tooling/metadata.py --repo examples/compliant-game --strict --out-dir dist/example-metadata
          python3 tooling/metadata.py --repo examples/compliant-game --package --out-dir dist/example-package
      - name: Policy questionnaire example kit
        run: python3 tooling/policy.py --answers examples/policy/answers.json --batch --out-dir dist/example-policy --formats md,html,pdf,docx --no-skill
      - name: Package skill
        run: python3 tooling/build.py --zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: csef-review-skill
          path: |
            dist/csef-review.zip
            dist/example/
            dist/example-coc/
            dist/example-policy/
            dist/example-compass/
