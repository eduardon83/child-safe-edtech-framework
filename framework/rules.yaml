# Child-Safe EdTech Framework (CSEF): rule catalogue. Single source of truth.
# Generated documents (catalogue, checklists, skill references, semgrep rules)
# are built from this file by tooling/build.py. Do not edit those by hand.
#
# Field reference (see framework/00-introduction.md for the full explanation):
#   id          PREFIX-AREA-NN. Prefixes: CORE, A (educational games), B (game-based
#               applications), C (gamified applications), AGE (age-band modifiers).
#   level       MUST | SHOULD
#   tier        1 = legal baseline, 2 = forward-compliant, 3 = best practice
#   profiles    [core] applies to every product; otherwise any of [A, B, C]
#   age_bands   [all] or any of [B1, B2, B3, B4, B5]
#   features    optional. Rule only applies if the product declares one of these
#               features in its manifest (or if there is no manifest).
#   sources     ids from framework/sources.yaml or a loaded pack
#   effort      low | medium | high (used to prioritise the improvement list)
#   detection   method: static | manifest | manual | mixed, plus patterns

version: "0.11.0"

# Rules merged into others. Packs, waivers and csef-ignore comments that use an old id keep working:
# the tools map it to the rule that replaced it.
retired:
  - {id: A-SOC-01, replaced_by: CORE-SAF-05, since: "0.11.0"}
  - {id: A-ECO-04, replaced_by: A-MOT-01, since: "0.11.0"}
  - {id: CORE-SAF-11, replaced_by: CORE-CHT-08, since: "0.11.0"}

rules:

  # ---------------------------------------------------------------- CORE: governance
  - id: CORE-GOV-01
    title: Product declares its CSEF manifest
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      The repository contains a CSEF manifest (csef.yaml) declaring profiles, age bands,
      context of use, GDPR role, features, AI use, third parties and chosen compliance level.
    rationale: >
      Accountability (GDPR Art. 5(2)) requires being able to show what the product does with
      children's data. The manifest is also what lets the checks select the right rules.
    improvement: Copy templates/csef.yaml to the repository root and fill it in with the product owner.
    effort: low
    sources: [GDPR]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: manifest_missing, confidence: high}

  - id: CORE-GOV-02
    title: Legal scope of the EU KIDS Act is assessed and recorded
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      The manifest records whether the product is in scope of the EU KIDS Act (online game,
      AI companion, general conversational chatbot, social or video-sharing service) or exempt
      as a service designed primarily for education and operated by or on behalf of an
      educational establishment (Art. 2(4)(c)).
    rationale: >
      The same product can be exempt when deployed by a school and in scope when offered
      directly to families. Teams must know which situation they are in for each channel.
    improvement: Fill the `legal_scope.kids_act` field in csef.yaml for each distribution channel.
    effort: low
    sources: [KIDS, KIDS-FAQ]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: kids_act_scope_missing, confidence: medium}

  - id: CORE-GOV-03
    title: Child rights impact assessment
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      A child rights impact assessment (or a risk review in the sense of the DSA Art. 28
      guidelines) is documented, considers the best interests of the child, and involves
      children, guardians and educators in testing.
    rationale: >
      The DSA guidelines and UN General Comment No. 25 ask providers to weigh all children's
      rights (protection, participation, provision), not only data protection.
    improvement: Extend the DPIA with a child rights section (templates/dpia-starter.md, part C).
    effort: medium
    sources: [DSA-G28, UNCRC-GC25, EUKO]
    detection:
      method: manual

  # ---------------------------------------------------------------- CORE: data protection
  - id: CORE-DAT-01
    title: DPIA before launch
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      A Data Protection Impact Assessment exists before launch when children's data is processed
      at scale, with new technology (including AI), or for systematic monitoring of learners.
    rationale: Processing of vulnerable data subjects with new technology is high risk under GDPR Art. 35.
    improvement: >
      Start a DPIA with templates/dpia-starter.md. If the school or Ministry is controller, provide
      them the technical input; they sign it.
    effort: medium
    sources: [GDPR]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: dpia_missing, confidence: high}

  - id: CORE-DAT-02
    title: Controller and processor roles are defined, with processor agreements
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      The manifest states whether the provider acts as controller or processor, and every third
      party that touches personal data has a data processing agreement (GDPR Art. 28).
    rationale: Without defined roles nobody is accountable for legal basis, DPIA or data subject requests.
    improvement: "Record `gdpr_role` and `dpa_signed: true` for each third party, or remove the integration."
    effort: low
    sources: [GDPR]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: third_party_without_dpa, confidence: high}
        - {type: manifest, check: gdpr_role_missing, confidence: high}

  - id: CORE-DAT-03
    title: No transfers outside the EEA without a valid mechanism
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Personal data of minors is hosted in the EEA, or every transfer outside it has a documented
      transfer mechanism (adequacy decision, SCCs plus transfer impact assessment).
    rationale: GDPR Chapter V.
    improvement: Move hosting to an EEA region or record `transfer_mechanism` for the third party.
    effort: medium
    sources: [GDPR]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: transfer_outside_eea, confidence: high}

  - id: CORE-DAT-04
    title: No personal data in analytics events
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Analytics and telemetry events carry no direct identifiers (name, email, phone, IP address,
      precise location, free text typed by the child). Use pseudonymous IDs.
    rationale: Data minimisation and purpose limitation (GDPR Art. 5(1)(b)(c)).
    improvement: Replace identifiers with a pseudonymous learner ID and drop free-text fields from events.
    effort: low
    sources: [GDPR]
    detection:
      method: static
      patterns:
        - type: regex
          confidence: medium
          pattern: '(track|logEvent|capture|analytics\.\w+)\s*\([^)]*\b(email|e_mail|full_?name|first_?name|last_?name|phone|ip_?address|latitude|longitude)\b'
          flags: i

  - id: CORE-DAT-05
    title: Retention periods enforced by code
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Each category of learner data has a retention period, enforced by an automated deletion
      or anonymisation job, not only by policy text.
    rationale: Storage limitation (GDPR Art. 5(1)(e)).
    improvement: Add a scheduled deletion job per data category and list it in csef.yaml `retention`.
    effort: medium
    sources: [GDPR]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: retention_missing, confidence: medium}

  - id: CORE-DAT-06
    title: Data subject rights are supported by tooling
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Access, rectification, erasure and export of a learner's data can be executed by tooling
      (admin function or script), and the process is tested.
    rationale: GDPR Art. 15 to 20. Schools as controllers depend on the processor to execute requests.
    improvement: Build an admin export and delete function per learner and test it each release.
    effort: medium
    sources: [GDPR]
    detection:
      method: manual

  - id: CORE-DAT-07
    title: No real learner data outside production
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Seeds, fixtures, tests, staging databases and prompts sent to development AI tools use
      synthetic data only.
    rationale: Purpose limitation and security (GDPR Art. 5(1)(b)(f), Art. 32).
    improvement: Use a synthetic data generator (e.g. Faker) and block production dumps in non-production environments.
    effort: low
    sources: [GDPR]
    detection:
      method: static
      patterns:
        - type: regex
          confidence: medium
          globs: ['*seed*', '*fixture*', '*mock*', '*.sql', '*test*']
          pattern: '[A-Za-z0-9._%+-]+@(gmail|hotmail|outlook|yahoo|sapo|live|icloud)\.(com|pt|es|fr|de)'
          flags: i

  - id: CORE-DAT-08
    title: No biometric identification of minors
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: The product does not process face, voice or fingerprint data to identify children.
    rationale: Biometric data for identification is special category data (GDPR Art. 9). Disproportionate in education.
    improvement: Remove face or voice recognition. Use class codes, picture passwords or teacher-managed login.
    effort: medium
    sources: [GDPR]
    detection:
      method: static
      patterns:
        - {type: dependency, confidence: high, names: [face-api.js, '@vladmandic/face-api', face_recognition, deepface, '@aws-sdk/client-rekognition', amazon-rekognition, azure-cognitiveservices-face, '@azure/cognitiveservices-face']}
        - {type: regex, confidence: medium, pattern: '(faceRecognition|recognizeFace|FaceMatcher|detectAllFaces|compareFaces|voiceprint|speakerRecognition)'}

  - id: CORE-DAT-09
    title: Geolocation off and not collected unless essential
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      Precise geolocation is not collected. If a feature truly needs it, it is off by default
      and turned off again at the end of the session.
    rationale: KIDS Act Art. 11(1)(a) and 11(2) (applied to games via Art. 15(1)(b)). DSA Art. 28 guidelines on safe defaults.
    improvement: Remove location permissions or gate them behind an explicit, session-limited opt-in.
    effort: low
    sources: [KIDS, DSA-G28, GDPR]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, pattern: '(navigator\.geolocation|getCurrentPosition|watchPosition|ACCESS_FINE_LOCATION|NSLocationAlwaysUsageDescription|CLLocationManager|Input\.location\.Start)'}

  - id: CORE-DAT-10
    title: Microphone and camera off by default
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      Access to microphone and camera is off by default, requested only at the moment of use
      for a clear learning purpose, and the recording is not kept longer than needed.
    rationale: KIDS Act Art. 11(1)(b), applied to games via Art. 15(1)(b).
    improvement: Request media permissions just-in-time with a child-friendly explanation; never at start-up.
    effort: low
    sources: [KIDS, GDPR]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, pattern: '(getUserMedia|RECORD_AUDIO|android\.permission\.CAMERA|NSMicrophoneUsageDescription|NSCameraUsageDescription|Microphone\.Start|WebCamTexture)'}

  - id: CORE-DAT-11
    title: Consent for non-essential storage and cookies
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Non-essential cookies and local storage are only set after valid consent. Where consent is the legal
      basis for a child below the national age of digital consent, the guardian gives it (see AGE-B4-01).
    rationale: ePrivacy Art. 5(3). The national consent age (GDPR Art. 8) is set out in AGE-B4-01.
    improvement: Keep only strictly necessary storage, or add a guardian-facing consent flow.
    effort: medium
    sources: [EPRIV, GDPR, EDPB-CONSENT]
    detection:
      method: manual


  - id: CORE-DAT-12
    title: Child-friendly privacy information
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Privacy information exists in a version the target age can understand (very short sentences,
      icons, audio for non-readers), plus a full version for adults.
    rationale: GDPR Art. 12(1) requires clear language, in particular for information addressed to a child.
    improvement: Write a one-screen child version of the privacy notice and test it with children of the target age.
    effort: low
    sources: [GDPR, KIDS]
    detection:
      method: manual


  # ---------------------------------------------------------------- CORE: personal questions (feature: survey)
  # Questions to the child or family about the child's life, family, opinions, interests or feelings:
  # surveys, "about me" profiles, mood check-ins, onboarding questions. Quizzes about learning content are
  # assessment, not survey. Template for the register: templates/survey-register.md.
  - id: CORE-DAT-13
    title: Every personal question has a recorded purpose and can be skipped
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [survey]
    requirement: >
      Each question asked to a child or guardian about the child's life, family, opinions, interests
      or feelings is listed in a survey register with its learning purpose, the closed answers, who
      answers it, who can see the answers, how long they are kept and the legal basis. Every question
      offers "prefer not to say" with the same weight as the other answers, the whole set can be
      skipped, no part of the product depends on answering, and answering earns no points, coins,
      badges or other rewards.
    rationale: >
      Purpose limitation and data minimisation (GDPR Art. 5(1)(b)(c)) and data protection by design
      (Art. 25). A question without a purpose is data collected "just in case". Forcing, nudging or
      rewarding answers are deceptive design patterns (EDPB Guidelines 03/2022: skipping, stirring,
      obstructing), and a reward for telling turns disclosure into a game.
    improvement: Write the register from templates/survey-register.md, delete every question without a purpose, add "prefer not to say" and remove rewards for answering.
    effort: low
    sources: [GDPR, EDPB-DDP, UNCRC-GC25]
    detection:
      method: mixed
      patterns:
        - {type: manifest, check: survey_register_missing, confidence: high}
        - {type: regex, confidence: medium, flags: i, pattern: '((answer|complete|fill in|finish) (the |this |our )?(survey|questions?|questionnaire|about me)\W.{0,40}(earn|get|win|receive|unlock)\W.{0,20}(coins?|points?|gems?|xp|badges?|stars?)|(responde|completa|preenche|termina) (ao |o |a )?(inqu[eé]rito|question[aá]rio|perguntas?)\W.{0,40}(ganha|recebe|desbloqueia)\W.{0,20}(moedas|pontos|gemas|medalhas?|estrelas))'}

  - id: CORE-DAT-14
    title: No personal data about other people is collected from children
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [survey, ugc, chat, ai_generative]
    requirement: >
      The product does not ask children for the names, photos, voices, ages, jobs, health,
      whereabouts or contact details of relatives, friends or other people, and AI characters do
      not ask for them either. Where an activity needs such people, the child uses fictional
      characters or a generic role ("a grandparent"), and creation tools offer avatars instead of
      photos of real people.
    rationale: >
      The other person is not informed and cannot exercise their rights (GDPR Art. 14), there is
      rarely a legal basis (Art. 6), and children cannot judge what is safe to tell about others.
      Details about relatives can also reveal special category data (see CORE-DAT-15).
    improvement: Replace name and detail fields about other people with fictional characters picked from a list, and tell AI prompts not to ask about real people.
    effort: low
    sources: [GDPR, UNCRC-GC25]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '((mum|mom|mother|dad|father|grand(ma|pa|mother|father)|brother|sister|best friend)''?s? (full )?(name|job|age|phone|address|school)\b)'}
        - {type: regex, confidence: medium, flags: i, pattern: '((nome|idade|profiss[aã]o|trabalho|telefone|morada|escola) d[oa]s? (teu|tua|teus|tuas) (pai|m[aã]e|av[oóô]s?|irm[aã]os?|irm[aã]s?|tio|tia|primo|prima|amig[oa]s?|melhor amig[oa]))'}

  - id: CORE-DAT-15
    title: No questions that reveal special category data or family vulnerability
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [survey, ai_generative]
    requirement: >
      Children and guardians are not asked, directly or indirectly, about racial or ethnic origin,
      religion or beliefs, health or disability (of the child or of relatives), sexual orientation or
      political opinions, nor about family vulnerability: migration or residence status, parents'
      separation, bereavement, foster or residential care, income, debts or parents' jobs. Support
      needs are asked as product settings (bigger text, read-aloud, support language) chosen by the
      guardian or the child, never as a diagnosis or an origin. Mood check-ins are allowed only when
      the child picks the answer, it is not kept as a history per child (unless the child keeps it for
      themselves), it never becomes a label, and it is never inferred by AI (CORE-AI-01).
    rationale: >
      Data that reveal a special category indirectly, by deduction or cross-referencing, fall under
      GDPR Art. 9 (CJEU C-184/20): an innocent family question can reveal religion, origin or health.
      Vulnerability data is not Art. 9 but is high risk: it can hurt the child, expose them to peers
      and adults, and calls for a DPIA (Art. 35). UN General Comment 25 protects children's privacy,
      including towards the adults around them.
    improvement: Remove these questions, turn diagnoses into settings, and keep low-risk closed questions or move the activity to fiction. If a question is truly needed, the controller (usually the school) decides it with a DPIA and an Art. 9(2) exception.
    effort: low
    sources: [GDPR, CJEU-ART9, UNCRC-GC25]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(what is your (religion|ethnicity|nationality)|are you (christian|muslim|jewish|catholic|hindu)|where (are|were) your parents (from|born)|are your parents (separated|divorced)|do you live with (your )?(mum|mom|dad|both)|how much do your parents earn|what (does|do) your (mum|mom|dad|parents) do for (a )?(living|work))'}
        - {type: regex, confidence: medium, flags: i, pattern: '(qual (é|e) a tua (religi[aã]o|etnia|nacionalidade)|de onde s[aã]o os teus pais|onde nasceram os teus pais|os teus pais (est[aã]o|s[aã]o) (separados|divorciados)|vives com (a tua m[aã]e|o teu pai|os dois)|quanto ganham os teus pais|em que trabalh(a|am) (o teu pai|a tua m[aã]e|os teus pais))'}

  - id: CORE-DAT-16
    title: Who answers personal questions fits the child's age
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [survey]
    requirement: >
      For ages 3 to 9 (B1, B2), questions about the child's life are answered by a guardian with the
      child, not by the child alone. From 10, the child answers for themselves and guardians are told
      what is asked. From 13 (B4, B5), the child's answers about their opinions and feelings are not
      shown to guardians or teachers by default, unless the child chooses to share them or there is a
      safeguarding concern (CORE-CHT-08).
    rationale: >
      Children's evolving capacities and their right to privacy, including towards parents (UN General
      Comment 25). Guardian tools in the EU KIDS Act proposal (Art. 20) must respect the child's
      privacy. Young children cannot yet weigh what they share; teenagers need a private space.
    improvement: Move questions for under-10s to the guardian page; for teenagers, keep answers private by default and say so.
    effort: medium
    sources: [UNCRC-GC25, KIDS, GDPR]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: survey_answered_by_child, confidence: medium}

  - id: CORE-DAT-17
    title: Teachers see answers about children's lives only as class totals
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [survey]
    requirement: >
      Teachers and schools see answers to personal questions only as totals for a group of at least
      5 children per figure. A figure is hidden when it would still reveal a child: when every child
      gave the same answer, when two views differ by one child, or when filters narrow the group.
      Answers are never shown per child, on shared or projected screens, or in rankings. A per-child
      view exists only where the register's purpose requires it (for example, a child asks for help)
      and the child knows.
    rationale: >
      Aggregation over small or uniform groups still identifies people (Article 29 Working Party
      Opinion 05/2014). Minimisation and data protection by default (GDPR Art. 5(1)(c), 25(2)).
      Knowing a child's private life changes how adults and peers treat them. Extends B-OPS-01 to
      personal questions.
    improvement: Show only totals with a minimum group size, hide uniform or small cells, and remove per-child exports.
    effort: medium
    sources: [GDPR, WP216, UNCRC-GC25]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: survey_teacher_view_individual, confidence: high}
        - {type: manifest, check: survey_min_group_low, confidence: high}

  - id: CORE-DAT-18
    title: Answers stay with their purpose and under the family's control
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [survey]
    requirement: >
      Answers are used only for the purpose in the register. They stay within the school's
      deployment and follow its instructions, are deleted at the end of the retention period, and are
      not used for advertising, profiling beyond the declared personalisation, AI training, or
      research unless B-DAT-01 is met and the approval is recorded. Personalisation based on the
      answers is explained to the child, shown to the guardian for children under 13, and can be
      changed or switched off. The child or guardian can see, correct and delete the answers at any
      time.
    rationale: >
      Purpose limitation (GDPR Art. 5(1)(b)), rights of access, rectification and erasure (Art. 15 to
      17), processor duties (Art. 28). Recital 71: decisions based on profiling should not concern a
      child. The EU KIDS Act proposal asks for high privacy by default for minors.
    improvement: Keep answers in the class instance, add see, correct and delete for answers, and make personalisation visible and reversible.
    effort: medium
    sources: [GDPR, KIDS]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: survey_research_without_approval, confidence: medium}

  # ---------------------------------------------------------------- CORE: commercial
  - id: CORE-COM-01
    title: No advertising or ad tracking SDKs
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      No advertising based on profiling of minors and no ad, attribution or fingerprinting SDKs
      in products used by minors.
    rationale: DSA Art. 28(2) bans profiling-based ads to minors on online platforms. The DFA proposal extends this to all traders.
    improvement: Remove the SDK. If marketing attribution is needed, measure it on the adult-facing website only.
    effort: low
    sources: [DSA, DFA, GDPR]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: high, globs: ['*.cs'], pattern: '\b(Advertisement\.(Initialize|Show|Load)|MobileAds\.Initialize|FB\.Init|AppsFlyer\.initSDK|IronSource\.Agent|LevelPlay\.Init|AdjustConfig)\b'}
        - type: dependency
          confidence: high
          names: [react-native-google-mobile-ads, google-mobile-ads, '@capacitor-community/admob', admob-plus-cordova, react-native-fbsdk, react-native-fbsdk-next, facebook-nodejs-business-sdk, facebook_business, react-native-appsflyer, appsflyer-capacitor-plugin, react-native-adjust, '@adjustcom/adjust-web-sdk', react-native-branch, branch-sdk, '@fingerprintjs/fingerprintjs', '@fingerprintjs/fingerprintjs-pro', Google-Mobile-Ads-SDK, FBSDKCoreKit, AppsFlyerFramework, Adjust, 'com.google.android.gms:play-services-ads', 'com.facebook.android:facebook-android-sdk', 'com.appsflyer:af-android-sdk', 'com.adjust.sdk:adjust-android', google_mobile_ads, appsflyer_sdk, adjust_sdk, com.unity.ads, com.unity.services.levelplay, com.google.ads.mobile, com.ironsource.sdk, GoogleMobileAds, Unity.Advertisements, Google.Apis.AdSense.v2]
        - {type: regex, confidence: high, pattern: '(googletagservices\.com|doubleclick\.net|connect\.facebook\.net/[^"'' ]*/fbevents\.js|adsbygoogle)'}

  - id: CORE-COM-02
    title: Third-party analytics and session recording reviewed
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      Product analytics and session-replay tools are either self-hosted in the EEA or bound by a
      processor agreement that forbids reuse of data. Session recording is not used on child-facing screens.
    rationale: Many analytics vendors reuse data for their own purposes, which would make them controllers (GDPR Art. 28).
    improvement: Prefer self-hosted analytics (e.g. EU-hosted PostHog or Matomo) with IP anonymisation; remove session replay from child screens.
    effort: medium
    sources: [GDPR, DSA-G28]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, globs: ['*.cs'], pattern: '\b(Firebase\.Analytics|GameAnalyticsSDK|AnalyticsService\.Instance)\b'}
        - type: dependency
          confidence: medium
          names: ['@react-native-firebase/analytics', firebase-analytics, mixpanel-browser, mixpanel-react-native, '@amplitude/analytics-browser', '@segment/analytics-next', '@hotjar/browser', '@fullstory/browser', '@microsoft/clarity', logrocket, smartlook-client, posthog-js, com.unity.services.analytics, com.unity.analytics, com.google.firebase.analytics, com.gameanalytics.sdk]
        - {type: regex, confidence: medium, pattern: '(getAnalytics\s*\(|static\.hotjar\.com|clarity\.ms/tag)'}

  - id: CORE-COM-03
    title: No dark patterns
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      No fake urgency or scarcity, confirmshaming, pre-ticked options, nagging after a choice,
      obstruction to leave or cancel, fake notifications, or confusing double negatives.
    rationale: DSA Art. 25, UCPD. The DFA proposal blacklists these in all circumstances.
    improvement: Rewrite the copy neutrally, remove timers and pre-selected options, make 'no' as easy as 'yes'.
    effort: low
    sources: [DSA, UCPD, DFA, R-RADESKY2022]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: high, flags: i, pattern: '(only \d+ left|offer ends in|hurry[,!]? |last chance|don''t miss out|limited time offer|só restam \d+|última oportunidade|oferta termina|despacha-te|não percas)'}
        - {type: regex, confidence: medium, flags: i, pattern: '(no thanks,? i (don''t|do not) want|não,? não quero aprender|i prefer to stay (bad|behind))'}
        - {type: regex, confidence: medium, pattern: '(defaultChecked|checked)\s*=\s*\{?\s*true'}

  - id: CORE-COM-04
    title: Purchases are adult-facing only
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Children are never directly exhorted to buy, and any purchase flow is behind an adult gate
      (guardian or school account), with the price in real currency.
    rationale: UCPD Annex I point 28 (direct exhortation to children). KIDS Act Art. 13 and 14(1)(c).
    improvement: Move purchases to a guardian or school portal; remove buy prompts from child screens.
    effort: medium
    sources: [UCPD, KIDS, DFA]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, globs: ['*.cs'], pattern: '\b(UnityPurchasing\.Initialize|IDetailedStoreListener|IStoreListener|CodelessIAPStoreListener)\b'}
        - {type: dependency, confidence: medium, names: [react-native-iap, expo-in-app-purchases, '@revenuecat/purchases-js', react-native-purchases, cordova-plugin-purchase, in_app_purchase, purchases_flutter, com.unity.purchasing, com.unity.services.purchasing]}
        - {type: manifest, check: monetisation_for_minors, confidence: high}

  # ---------------------------------------------------------------- CORE: safety by design
  - id: CORE-SAF-01
    title: Most protective settings by default
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      Profiles private, sharing off, contact off, notifications off, recommendations of other users
      off by default. The product never relaxes these defaults on its own. Only an adult, or a 16 or 17
      year old after clear information and an explicit choice (AGE-B5-01), can change them.
    rationale: KIDS Act Art. 8(1) and 11(1). DSA Art. 28 guidelines.
    improvement: Flip the defaults in the settings model and add a test that asserts them.
    effort: low
    sources: [KIDS, DSA-G28]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, pattern: '(isPublic|publicProfile|profileVisibility|shareEnabled|allowMessages|discoverable)\s*[:=]\s*(true|[''"]public[''"])'}

  - id: CORE-SAF-02
    title: Notifications only about the child's own activity, off by default, quiet hours
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [notifications]
    requirement: >
      Push notifications are off by default, never designed to prompt the child to start or resume
      use, only relate to the child's own activity or teacher assignments, and respect school time
      and core sleep hours.
    rationale: KIDS Act Art. 9(2)(b) and 11(1)(d), applied to games via Art. 15(1).
    improvement: Default the push flag to false, remove re-engagement campaigns, add quiet hours (e.g. 21:00 to 08:00 and school hours).
    effort: low
    sources: [KIDS, DSA-G28, DFA]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: high, pattern: '(push(Notifications)?Enabled|notificationsEnabled|enablePush)\s*[:=]\s*true'}
        - {type: regex, confidence: high, flags: i, pattern: '(we miss you|come back and play|your friends are waiting|it''s been a while|temos saudades|volta a jogar|os teus amigos estão à tua espera)'}

  - id: CORE-SAF-03
    title: Natural stopping points, no autoplay or endless feeds
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      No autoplay of the next content and no infinite scroll. Sessions have natural endings and
      regular interruption moments that let the child decide whether to continue.
    rationale: KIDS Act Art. 9(2)(a). DFA proposal gives users the right to switch off autoplay.
    improvement: Remove autoplay; end each activity with a clear 'done' screen and an explicit choice to continue.
    effort: low
    sources: [KIDS, DFA, DSA-G28, R-RADESKY2022]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, pattern: '(autoPlayNext|autoplayNext|autoplay\s*[:=]\s*true|<video[^>]*\sautoplay)'}
        - {type: dependency, confidence: medium, names: [react-infinite-scroll-component, react-infinite-scroller, ngx-infinite-scroll, vue-infinite-loading]}

  - id: CORE-SAF-04
    title: Time-awareness tools
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      The product offers break reminders and lets guardians or teachers set a daily time limit,
      protecting school time (outside class use) and core sleep hours.
    rationale: KIDS Act Art. 9(3) and 20(4)(a) require time-limited access for social and video services. Best practice for all products.
    improvement: Add a session timer with a gentle break screen and a configurable daily limit.
    effort: medium
    sources: [KIDS, KIDS-COM]
    detection:
      method: manual

  - id: CORE-SAF-05
    title: No contact from strangers; play stays in closed groups
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Nobody outside the child's approved group (class, guardian-approved contacts) can initiate
      contact, see the child's profile or content, or add the child to a group. Multiplayer happens in
      groups set up by a teacher or guardian; play across groups only through pairing arranged by
      adults. The product cannot be used to lure children to other services.
    rationale: >
      DSA Art. 28 and guidelines. KIDS Act Art. 12(1), applied to games via Art. 15(1)(c) and 15(2).
      Merges A-SOC-01 (retired in 0.11.0).
    improvement: Scope all interaction to closed groups managed by a teacher or guardian (class rooms with join codes); remove user search and contact suggestions; block external links and handles (CORE-CHT-05).
    effort: high
    sources: [DSA, DSA-G28, KIDS]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, pattern: '(searchUsers|findFriends|suggestedFriends|peopleYouMayKnow|friendSuggestions|addFriendByName|randomMatch|findRandomPlayer|joinPublicRoom|publicLobby|globalChat|worldChat)'}


  - id: CORE-SAF-06
    title: Reports are acknowledged, answered and followed by help
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication, ai_generative]
    requirement: >
      Wherever children interact with others or with generated content, they can report it, AI output
      included. After a report the child (1) sees at once, in words for their age, that it arrived, what
      happens next and when; (2) gets help information straight away (a trusted adult, the national
      helpline); (3) is told the outcome when it is handled, without details about other children ("we
      took action", or "we looked and did not find a problem, and this is why"); and (4) can say "it is
      still happening", which reopens the report. Reports from minors are handled first.
    rationale: >
      DSA Art. 16(5) requires telling the person who reported about the decision without undue delay. KIDS
      Act Art. 19 asks for child-friendly reporting and support. Children stop reporting when nothing seems
      to happen. The report and block tools themselves are in CORE-CHT-02.
    improvement: Add an acknowledgement screen and an outcome message in child language, a "still happening" button that reopens the case, and a measure of time from report to outcome.
    effort: medium
    sources: [KIDS, DSA, DSA-G28, CB-AP]
    detection:
      method: manual


  - id: CORE-SAF-07
    title: Tools for guardians and teachers that respect the child
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      Guardians (or teachers in school use) can manage settings, time and contacts. The child is
      told when such tools are active. Controls cannot be bypassed by the child.
    rationale: KIDS Act Art. 20, applied to online games by Art. 15(1)(d).
    improvement: Provide a guardian or teacher panel for settings, time limits and contacts, with an in-app notice to the child.
    effort: high
    sources: [KIDS, UNCRC-GC25]
    detection:
      method: manual

  - id: CORE-SAF-08
    title: Proportionate, privacy-preserving age assurance
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      Where age matters, age assurance is proportionate, uses zero-knowledge solutions such as the
      EU age verification app, does not store identity documents and only keeps an age signal.
      Self-declaration alone is not relied on for high-risk features.
    rationale: >
      KIDS Act Art. 27 and 28: age assurance must be accurate and privacy-preserving, and its data may
      never be used to identify, track, target, advertise to or profile the user (Art. 28(1)). Art. 31
      requires Member States to provide free EU age verification and guardian attestation means.
      DSA Art. 28 guidelines. EU age verification Recommendation.
    improvement: >
      Integrate the EU age verification solution or the EUDI wallet, and the national guardian
      attestation when available (KIDS Act Art. 31); store only an 'over threshold' flag and never
      reuse age assurance data for any other purpose.
    effort: high
    sources: [KIDS, DSA-G28, AVREC]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(id_?card_?(image|photo|upload)|passport_?(image|photo|upload)|upload(Id|Passport)Document)'}

  - id: CORE-SAF-09
    title: Children can control and give feedback on what they see
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [B3, B4, B5]
    requirement: >
      Children can adjust settings that affect how they interact and what they are shown, give
      feedback with lasting effect, and easily return to default settings.
    rationale: KIDS Act Art. 18.
    improvement: Add a simple 'my settings' screen with a 'reset to safe settings' button.
    effort: medium
    sources: [KIDS, UNCRC-GC25]
    detection:
      method: manual

  - id: CORE-SAF-10
    title: No social comparison or image-altering features
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      No follower counts, likes on the child's appearance, beauty filters, or features that
      embellish or idealise the child's image.
    rationale: KIDS Act Art. 11(3).
    improvement: Remove public counters and appearance filters; use avatars instead of photos.
    effort: low
    sources: [KIDS]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(followerCount|followersCount|likeCount|beautyFilter|faceFilter|skinSmooth)'}


  # ---------------------------------------------------------------- CORE: AI
  - id: CORE-AI-01
    title: No emotion recognition on learners
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: The product does not infer emotions of learners from face, voice, posture, typing or other biometric signals.
    rationale: AI Act Art. 5(1)(f) prohibits emotion recognition in education institutions since 2 Feb 2025.
    improvement: Remove emotion inference. Use explicit signals (a help button, a self-report mood picker).
    effort: medium
    sources: [AIA]
    detection:
      method: static
      patterns:
        - {type: dependency, confidence: high, names: [fer, hume, '@humeai/voice', affdex, '@affectiva/affdex', emotion-recognition, py-feat]}
        - {type: regex, confidence: high, pattern: '(withFaceExpressions|detectEmotion|emotionRecognition|recognizeEmotion|facialExpression|sentimentFromFace|frustrationDetect)'}

  - id: CORE-AI-02
    title: No manipulative AI exploiting age
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      AI features do not use subliminal, manipulative or deceptive techniques, or exploit age-related
      vulnerability, to change a child's behaviour in a harmful way.
    rationale: AI Act Art. 5(1)(a)(b).
    improvement: Review prompts and reward logic for persuasion targets that serve engagement over learning; document the review.
    effort: medium
    sources: [AIA]
    detection:
      method: manual

  - id: CORE-AI-03
    title: AI interaction and AI-generated content are disclosed
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      Children (and teachers) are told, in age-appropriate form, when they interact with AI and
      when content is AI-generated. Generated media is marked.
    rationale: AI Act Art. 50, applicable from 2 Aug 2026.
    improvement: Add a persistent 'AI' label on AI responses and metadata marking on generated images and audio.
    effort: low
    sources: [AIA]
    detection:
      method: mixed
      patterns:
        - {type: dependency, confidence: medium, names: [openai, '@anthropic-ai/sdk', anthropic, '@google/generative-ai', '@google/genai', google-generativeai, '@mistralai/mistralai', mistralai, groq-sdk, ai, '@ai-sdk/openai', langchain, '@langchain/core', elevenlabs, '@elevenlabs/elevenlabs-js']}

  - id: CORE-AI-04
    title: AI inventory and no training on learners' data by default
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [ai_generative, ai_assessment, ai_adaptive]
    requirement: >
      Every AI component is listed (model, provider, purpose, inputs, outputs, oversight). Provider
      data retention for training is disabled. Learners' data is not used to train or fine-tune
      models without a DPIA and a lawful basis.
    rationale: GDPR Art. 5 and 35. AI Act Art. 4 (AI literacy) and provider transparency.
    improvement: Create docs/ai-inventory.md and switch providers to zero-retention or no-training settings.
    effort: low
    sources: [GDPR, AIA]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: ai_without_inventory, confidence: high}

  - id: CORE-AI-05
    title: Age-appropriate AI input and output filters
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      Input and output filters are set for the target age band and the product's languages, block content
      unsuitable for that age, and fail safe: no answer rather than an unfiltered one. Testing before and
      after release is in CORE-AI-09.
    rationale: KIDS Act Art. 14(1)(e)(f) for chatbots and companions. Best practice for any child-facing generative AI.
    improvement: Set filters per age band and language; send filter failures to a safe fallback message.
    effort: medium
    sources: [KIDS, AIA]
    detection:
      method: manual


  - id: CORE-AI-06
    title: No AI persona that simulates a relationship
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      AI characters are friendly but never claim feelings, friendship, missing the child, or
      exclusivity, and do not create emotional dependency (see CORE-AI-08 for conversation memory).
    rationale: >
      KIDS Act Art. 3(5)(c) and 14(1)(a)(b): such a system would be an 'AI companion' in scope,
      even in an educational product. DFA proposal: right to switch off relationship-simulating chatbots.
    improvement: Rewrite the system prompt persona; add tests that reject outputs claiming feelings or friendship.
    effort: low
    sources: [KIDS, DFA, AIA]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: high, flags: i, pattern: '(i missed you|i love you|i''m your (best )?friend|you are my (best )?friend|only i understand you|don''t leave me|tive saudades tuas|sou o teu melhor amigo|és o meu melhor amigo|não me deixes)'}

  - id: CORE-AI-07
    title: Human review of decisions about learners
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [ai_assessment, ai_adaptive]
    requirement: >
      No grade, level placement, certification or access decision about a learner is taken solely
      by automated processing. A teacher can see, explain and override it.
    rationale: GDPR Art. 22. AI Act Annex III(3) human oversight requirements from 2 Dec 2027.
    improvement: Make automated results provisional until a teacher confirms; show the reasons.
    effort: medium
    sources: [GDPR, AIA, AIA-OMNIBUS]
    detection:
      method: manual

  # ---------------------------------------------------------------- CORE: accessibility
  - id: CORE-ACC-01
    title: WCAG 2.2 AA
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Interfaces meet WCAG 2.2 level AA (aligned with EN 301 549), with automated checks in CI
      and manual screen-reader testing per release.
    rationale: European Accessibility Act for covered services; public procurement rules for schools.
    improvement: Add axe-core or Pa11y to CI and fix contrast, labels, focus order and keyboard access.
    effort: medium
    sources: [EAA, WCAG22, EN301549]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, globs: ['*.html', '*.jsx', '*.tsx', '*.vue', '*.svelte'], pattern: '<img(?![^>]*\balt=)[^>]*>'}

  - id: CORE-ACC-02
    title: No flashing content
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: Nothing flashes more than three times per second.
    rationale: WCAG 2.3.1. Photosensitive seizure risk.
    improvement: Slow or remove flashing effects; offer a 'reduce motion' setting that respects prefers-reduced-motion.
    effort: low
    sources: [WCAG22, EAA, EN301549, W3C-233]
    detection:
      method: manual

  - id: CORE-ACC-03
    title: Inclusive design for children with special educational needs
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Adjustable speed and time limits, audio alternatives for text, captions, dyslexia-friendly
      typography options, and support for switch or keyboard-only play.
    rationale: Accessibility beyond the AA floor is what makes a learning product usable by every child.
    improvement: Add a settings panel for speed, audio, captions and font; test with SEN teachers.
    effort: medium
    sources: [WCAG22, UNCRC-GC25]
    detection:
      method: manual

  # ---------------------------------------------------------------- CORE: security
  - id: CORE-SEC-01
    title: No secrets in the repository
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: API keys, tokens and passwords are not committed.
    rationale: GDPR Art. 32 (security of processing).
    improvement: Rotate the exposed key, move it to a secret manager, and add gitleaks to CI.
    effort: low
    sources: [GDPR]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: high, pattern: '(sk-[A-Za-z0-9]{32,}|sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)'}

  - id: CORE-SEC-02
    title: Access control on every store of learner data
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Every table, bucket or collection with learner data enforces access control at the data
      layer (e.g. row-level security), not only in the client.
    rationale: GDPR Art. 25 and 32. Client-only checks are easily bypassed.
    improvement: Enable row-level security with policies scoped to class and role; add a test per table.
    effort: medium
    sources: [GDPR]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, globs: ['*.sql'], flags: i, pattern: 'disable row level security'}

  - id: CORE-SEC-03
    title: Encryption in transit
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: All network calls use TLS. No plain http endpoints for APIs or assets.
    rationale: GDPR Art. 32.
    improvement: Switch the URL to https and enable HSTS.
    effort: low
    sources: [GDPR]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, pattern: '[''"]http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|www\.w3\.org|schemas\.|xmlns)[^''"]+[''"]'}

  - id: CORE-SEC-04
    title: No personal data in logs
    level: SHOULD
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: Application logs contain pseudonymous IDs only, with short retention.
    rationale: GDPR Art. 5(1)(c) and 32. Logs are often copied to third-party tools.
    improvement: Log the learner ID instead of names or emails; add a log scrubber.
    effort: low
    sources: [GDPR]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, pattern: '(console\.(log|info|warn|error)|logger\.\w+|print)\s*\([^)]*\b(email|fullName|full_name|firstName|first_name|lastName|phone|password)\b'}

  - id: CORE-SEC-05
    title: Vulnerability handling and breach response
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      A published way to report vulnerabilities (SECURITY.md or security.txt), a process to fix them,
      and a breach procedure that lets controllers meet the 72-hour notification deadline.
    rationale: GDPR Art. 33. Cyber Resilience Act reporting obligations for products with digital elements.
    improvement: Add SECURITY.md and an incident runbook with contact chain and timelines.
    effort: low
    sources: [GDPR, CRA]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: security_policy_missing, confidence: medium}

  - id: CORE-SEC-06
    title: Strong authentication for adults, simple safe login for children
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Teacher and admin accounts use MFA. Children use age-appropriate login (class code,
      picture password, teacher reset) without email or phone collection.
    rationale: Adult accounts hold data on whole classes. Children should not need personal contact details to log in.
    improvement: Enforce MFA for staff roles; replace child email login with class codes.
    effort: medium
    sources: [GDPR, DSA-G28]
    detection:
      method: manual

  # ---------------------------------------------------------------- CORE: several countries and shared infrastructure
  # Many products are built for several countries at once, and Member States are starting to build shared
  # education infrastructure (EDU-EDIC, 2026). These rules prepare the architecture for both.
  # Guide: framework/05-several-countries.md.
  - id: CORE-INT-01
    title: Country rules are configuration, not code
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Rules that differ between countries live in per-country configuration, not in code: the age of digital
      consent and guardian consent steps, retention periods, national approvals (for example MIME in
      Portugal), safeguarding contacts and helplines, languages, school calendars and curriculum mappings.
      Each value has an owner and a source. An unknown country falls back to the most protective value.
      Adding a country is a configuration change and a review, not a code change.
    rationale: >
      GDPR Art. 8 lets each Member State set the age of digital consent between 13 and 16, and national rules
      on school surveys, safeguarding and retention differ. A product sold in several countries, or offered
      through shared infrastructure such as the EDU-EDIC, needs these differences to be explicit, reviewable
      and testable. Hard-coded values silently apply one country's rules everywhere.
    improvement: Move country-specific values into one versioned file per country, reference it as `country_config` in csef.yaml, and default to the strictest value.
    effort: medium
    sources: [GDPR, EDU-EDIC]
    detection:
      method: mixed
      patterns:
        - {type: manifest, check: country_config_missing, confidence: medium}
        - {type: regex, confidence: medium, flags: i, pattern: '(age_?of_?(digital_?)?consent|digital_?consent_?age|consent_?age|min(imum)?_?consent_?age)["'']?\s*[:=]\s*1[3-6]\b'}

  - id: CORE-INT-02
    title: Schools can take their data and leave
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      The school, or whoever buys the product, can export all of its data at class and school level in
      documented, machine-readable open formats: rosters, results, learner-created work and settings, with
      the schema published. Where the product exchanges data with school systems it uses open standards
      (OneRoster for rosters and results, LTI 1.3 for launching from a learning platform). The exit process is
      documented with timelines, and switching costs nothing beyond the subscription.
    rationale: >
      Data Act Chapter VI gives customers of data processing services, SaaS included, a right to switch and
      prohibits switching charges from 12 January 2027 (Art. 29). GDPR Art. 20 covers portability for each
      learner (CORE-DAT-06). Interoperable infrastructure and less lock-in are aims of the EDU-EDIC.
    improvement: Add a school-level export in CSV or JSON with a published schema (OneRoster where it fits), describe the exit process in the contract, and test a full export each release.
    effort: medium
    sources: [DATA-ACT, GDPR, 1EDTECH, EDU-EDIC]
    detection:
      method: manual

  - id: CORE-INT-03
    title: Sign-in and rosters come from the school, with the minimum data
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    features: [accounts]
    requirement: >
      In schools, learners and teachers sign in through the school's identity provider (OpenID Connect or
      SAML) or are launched from the school's learning platform (LTI 1.3), instead of creating separate
      product accounts. Roster imports carry only the fields the product needs (no birth dates, addresses or
      national identity numbers unless a rule requires them), and learner records use pseudonymous
      identifiers.
    rationale: >
      Fewer separate accounts mean fewer stored passwords and less personal data (GDPR Art. 5(1)(c) and 25).
      Standard sign-in and launch let the same product run in several countries and on shared infrastructure
      such as the EDU-EDIC without rebuilding each integration.
    improvement: Support OpenID Connect sign-in and LTI 1.3 launch, trim roster imports to the minimum fields, and key learner records on pseudonymous IDs.
    effort: medium
    sources: [GDPR, 1EDTECH, EDU-EDIC]
    detection:
      method: manual

  - id: CORE-INT-04
    title: Critical dependencies are declared and replaceable
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Every third party records where it is established (`jurisdiction`) as well as where it hosts data
      (`region`), and whether the product stops working without it (`critical`). A critical provider
      established outside the EU or EEA, AI model providers included, has a documented `fallback`: an
      alternative established in the EU behind the same internal interface, or a reduced mode that keeps
      learning available. Features call AI models through one internal interface, so a school or a country
      can require a different model.
    rationale: >
      Data hosted in the EU may still be reachable under the laws of the provider's home country, and one
      provider changing its terms or leaving can stop a product used by thousands of schools. Reducing
      structural dependencies on third-country providers is an aim of the EDU-EDIC. Builds on CORE-DAT-02
      (processor agreements) and CORE-DAT-03 (transfers).
    improvement: Add `jurisdiction`, `critical` and `fallback` to each third party in csef.yaml, put AI calls behind one internal interface, and test the fallback once a year.
    effort: medium
    sources: [EDU-EDIC, GDPR]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: third_party_jurisdiction_missing, confidence: medium}
        - {type: manifest, check: critical_dependency_without_fallback, confidence: medium}

  # ---------------------------------------------------------------- CORE: content
  - id: CORE-CNT-01
    title: Asset provenance and licences recorded
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Every image, sound, font and AI-generated asset has a recorded source, licence, author and,
      for AI assets, the model used.
    rationale: Copyright compliance and AI Act Art. 50 marking of generated content.
    improvement: Keep an assets/PROVENANCE.csv and check it in CI.
    effort: low
    sources: [AIA]
    detection:
      method: manual

  - id: CORE-CNT-02
    title: Age rating self-assessment
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      The product has a documented age-appropriateness assessment covering violence, fear, language,
      in-app purchases, contact risks and addictive features (PEGI-style descriptors).
    rationale: KIDS Act Art. 16 and 17 foresee harmonised age ratings covering monetisation and contact risks.
    improvement: Run a PEGI-style self-assessment and publish the resulting age and descriptors.
    effort: low
    sources: [PEGI, KIDS]
    detection:
      method: manual

  # ================================================================ PROFILE A: educational games
  - id: A-ECO-01
    title: No paid randomised rewards (loot boxes)
    level: MUST
    tier: 2
    profiles: [A, B, C]
    age_bands: [all]
    requirement: >
      No loot boxes, gacha, mystery chests or other variable rewards that can be obtained with
      money or with currency purchasable with money.
    rationale: KIDS Act Art. 13(2) bans variable reward systems on social and video services. DFA proposal bans paid loot boxes for minors in games.
    improvement: Replace with fixed, visible rewards earned through learning.
    effort: medium
    sources: [KIDS, DFA]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: high, flags: i, pattern: '(loot_?box|lootbox|gacha|mystery_?(box|chest)|openChest|randomReward|caixa_?mist[eé]rio|ba[uú]_?surpresa)'}

  - id: A-ECO-02
    title: No pay-to-win
    level: MUST
    tier: 2
    profiles: [A, B, C]
    age_bands: [all]
    requirement: Nothing bought with money gives a gameplay or learning advantage.
    rationale: DFA proposal bans pay-to-win for minors. Fairness in learning.
    improvement: Make all progression earnable through play; keep any paid items cosmetic and adult-purchased.
    effort: medium
    sources: [DFA, UCPD]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(buy(Boost|PowerUp|Hint|Lives|Energy)|purchase(Boost|PowerUp|Hint|Lives|Energy)|comprar(Vidas|Energia|Dica))'}

  - id: A-ECO-03
    title: Virtual currency shows its real value
    level: MUST
    tier: 2
    profiles: [A, C]
    age_bands: [all]
    requirement: >
      Where adults can buy in-game currency (children never can, CORE-COM-04), its value in euro is shown
      wherever it is spent, and spending it is off for children unless a guardian approves.
    rationale: KIDS Act Art. 13(1) (applied to chatbots via Art. 14(1)(c)). DFA proposal.
    improvement: Show euro equivalents wherever currency is spent; add guardian approval; keep currency purchases out of child screens.
    effort: medium
    sources: [KIDS, DFA, UCPD]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(buy(Gems|Coins|Diamonds|Crystals)|purchase(Gems|Coins|Diamonds|Crystals)|gemPack|coinPack|comprar(Gemas|Moedas|Diamantes))'}


  - id: A-PLY-01
    title: No penalties for not playing
    level: MUST
    tier: 2
    profiles: [A, C]
    age_bands: [all]
    requirement: >
      No energy systems that only refill by waiting or paying, no pets or worlds that decay or die
      when the child is away, no loss of benefits for missing days.
    rationale: KIDS Act Art. 9(2)(d) applied to online games by Art. 15(1)(a).
    improvement: Remove decay and energy timers; let the world wait for the child unchanged.
    effort: medium
    sources: [KIDS, DFA, R-RADESKY2022]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(energyRefill|staminaRefill|refillTimer|petHunger|decayRate|witherTime|cropsWither|energia_?recarga)'}

  - id: A-PLY-02
    title: Non-shaming failure and feedback
    level: SHOULD
    tier: 3
    profiles: [A, B]
    age_bands: [all]
    requirement: Errors and failures are presented as part of learning, without ridicule, sad animations directed at the child, or public exposure.
    rationale: Psychological safety supports learning, especially for younger children.
    improvement: Review all failure states with an instructional designer; use encouraging, specific feedback.
    effort: low
    sources: [UNCRC-GC25, ARNAB2014]
    detection:
      method: manual

  - id: A-ASM-01
    title: In-game assessment is transparent and separated
    level: MUST
    tier: 2
    profiles: [A]
    age_bands: [all]
    features: [ai_assessment, assessment]
    requirement: >
      When gameplay is used to assess learning (stealth assessment), learners, teachers and guardians
      are told, assessment data is separated from general telemetry, and it is used only for the stated purpose.
    rationale: GDPR transparency and purpose limitation. AI Act Annex III(3)(b) if AI evaluates learning outcomes.
    improvement: Document what is assessed in the teacher guide and the child privacy notice; store assessment data separately.
    effort: medium
    sources: [GDPR, AIA, AIA-OMNIBUS]
    detection:
      method: manual

  # ================================================================ PROFILE B: game-based applications
  - id: B-EVL-01
    title: High-risk path for systems that evaluate or place learners
    level: MUST
    tier: 1
    profiles: [B]
    age_bands: [all]
    features: [ai_assessment, ai_adaptive]
    requirement: >
      AI that evaluates learning outcomes, steers learning, assigns levels or monitors tests is
      treated as an Annex III high-risk candidate: risk management file, data governance, logging,
      human oversight, accuracy and robustness testing.
    rationale: AI Act Annex III(3). Obligations apply from 2 Dec 2027 under the Digital Omnibus.
    improvement: Open a risk management file now (templates/ai-risk-file.md) and record the classification decision.
    effort: high
    sources: [AIA, AIA-OMNIBUS]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: high_risk_without_risk_file, confidence: high}

  - id: B-EVL-02
    title: No camera-based or biometric proctoring of minors
    level: MUST
    tier: 1
    profiles: [B]
    age_bands: [all]
    features: [assessment, ai_assessment]
    requirement: Tests are not proctored by webcam, eye tracking, keystroke biometrics or behaviour analysis of the child.
    rationale: AI Act Art. 5(1)(f) (emotion recognition) and Annex III(3)(d) (monitoring during tests). GDPR Art. 9.
    improvement: Use supervised test conditions in class instead of automated surveillance.
    effort: medium
    sources: [AIA, GDPR]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(proctor|eyeTracking|gazeTracking|tabSwitchDetect|keystrokeDynamics|webcamMonitor)'}

  - id: B-EVL-03
    title: Results are explainable and contestable
    level: MUST
    tier: 2
    profiles: [B]
    age_bands: [all]
    features: [assessment, ai_assessment]
    requirement: Teachers and learners can see why a result was given and can contest it with a human.
    rationale: GDPR Art. 22(3). AI Act transparency for high-risk systems.
    improvement: Show per-item evidence behind each score and a 'request review' action for teachers.
    effort: medium
    sources: [GDPR, AIA]
    detection:
      method: manual

  - id: B-EVL-04
    title: Validity, fairness and accessibility of assessment
    level: SHOULD
    tier: 3
    profiles: [B]
    age_bands: [all]
    features: [assessment, ai_assessment]
    requirement: >
      Assessment validity is documented, results are checked for bias across groups (gender,
      language background, SEN), and accommodations (extra time, audio) do not disadvantage learners.
    rationale: Good assessment practice and AI Act data governance expectations.
    improvement: Run a differential item functioning check on pilot data and document accommodations.
    effort: high
    sources: [AIA, UNCRC-GC25]
    detection:
      method: manual

  - id: B-UGC-01
    title: User-generated content is moderated and visible to the teacher
    level: MUST
    tier: 2
    profiles: [B, A, C]
    age_bands: [all]
    features: [ugc, chat]
    requirement: >
      Content created or uploaded by children is moderated proportionally to age, visible to the
      responsible teacher, reportable, and not public. Uploaded media has metadata (e.g. GPS) stripped.
    rationale: DSA Art. 28 guidelines. KIDS Act Art. 12(3) and 19.
    improvement: Add teacher review queues, EXIF stripping on upload, and keep galleries class-private.
    effort: medium
    sources: [DSA-G28, KIDS, GDPR]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, pattern: '(isPublic|visibility)\s*[:=]\s*[''"]?public'}

  - id: B-UGC-02
    title: No photos of children's faces kept or shared beyond need
    level: MUST
    tier: 2
    profiles: [B, A, C]
    age_bands: [all]
    features: [ugc]
    requirement: >
      Photos and videos of children are only stored when necessary for the learning activity, are
      never public, expire automatically, and others cannot download them.
    rationale: KIDS Act Art. 12(3)(e). GDPR minimisation and storage limitation.
    improvement: Prefer avatars; add auto-expiry and disable download of child media.
    effort: medium
    sources: [KIDS, GDPR]
    detection:
      method: manual

  - id: B-DAT-01
    title: Research use of learning data is separated
    level: MUST
    tier: 1
    profiles: [B, A, C]
    age_bands: [all]
    requirement: >
      Learning data is only shared for research under a data sharing agreement, with legal basis,
      ethics approval and pseudonymisation, and never as a by-product of normal operation.
    rationale: GDPR Art. 5(1)(b), 6 and 89.
    improvement: Create a research export pipeline that pseudonymises and logs every extract.
    effort: medium
    sources: [GDPR]
    detection:
      method: manual

  - id: B-SIM-01
    title: Sensitive simulations include warnings and debrief
    level: SHOULD
    tier: 3
    profiles: [B]
    age_bands: [all]
    requirement: Simulations about health, conflict, loss or other sensitive themes include a content note, an exit at any time, and a guided debrief.
    rationale: Protects children from distressing content and supports reflection.
    improvement: Add content notes and a debrief screen designed with the instructional team.
    effort: low
    sources: [UNCRC-GC25, DSA-G28]
    detection:
      method: manual

  - id: B-OPS-01
    title: Dashboards show learning, not surveillance
    level: SHOULD
    tier: 3
    profiles: [A, B, C]
    age_bands: [all]
    requirement: Teacher and guardian dashboards show what helps learning; they avoid minute-by-minute activity logs and are explained to the child. Answers to personal questions follow CORE-DAT-17.
    rationale: Respect for the child's privacy and agency (KIDS Act Art. 20(1)(f), UN GC 25).
    improvement: Aggregate activity data and show learning progress instead of raw logs.
    effort: medium
    sources: [KIDS, UNCRC-GC25]
    detection:
      method: manual

  # ================================================================ PROFILE C: gamified applications
  - id: C-ENG-01
    title: Streaks are optional and never punish
    level: MUST
    tier: 2
    profiles: [C, A]
    age_bands: [all]
    features: [streaks]
    requirement: >
      Streaks can be switched off, carry no loss framing, and missing a day costs nothing (free
      freezes or no reset).
    rationale: "KIDS Act Art. 9(2)(d) (penalties for not engaging). DFA proposal: right to switch off streak rewards."
    improvement: Add a 'turn off streaks' setting and replace 'you will lose your streak' with neutral progress messages.
    effort: low
    sources: [KIDS, DFA]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: high, flags: i, pattern: '(lose your streak|streak (will be )?lost|don''t break (your|the) (streak|chain)|perdes a tua sequ[eê]ncia|vais perder a sequ[eê]ncia|n[aã]o quebres a sequ[eê]ncia)'}
        - {type: regex, confidence: medium, pattern: '(resetStreak|streakReset|breakStreak)'}

  - id: C-ENG-02
    title: Leaderboards are class-scoped and pseudonymous
    level: MUST
    tier: 2
    profiles: [C, A]
    age_bands: [all]
    features: [leaderboards]
    requirement: >
      Leaderboards are limited to the class or group, show avatars or nicknames, can be disabled
      by the teacher, and never publicly rank named children.
    rationale: KIDS Act Art. 11(3) (social comparison). GDPR minimisation.
    improvement: Scope leaderboards to class, use nicknames, add a teacher toggle, and consider showing personal bests only.
    effort: medium
    sources: [KIDS, GDPR, DSA-G28, R-HANUS2015, R-SAILER2020]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(globalLeaderboard|publicLeaderboard|worldRanking|leaderboard[^\n]{0,80}(fullName|full_name|realName))'}

  - id: C-ENG-03
    title: Points and badges have no money value
    level: MUST
    tier: 2
    profiles: [C]
    age_bands: [all]
    requirement: Points, badges and levels cannot be bought, sold or exchanged for money or goods.
    rationale: KIDS Act Art. 13. Keeps gamification about learning.
    improvement: Remove any purchase or exchange path for points.
    effort: low
    sources: [KIDS, DFA]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(buyPoints|purchasePoints|buyXp|purchaseXp|redeemForCash|pointsToCredit)'}

  - id: C-ENG-04
    title: No variable reward schedules designed for engagement
    level: SHOULD
    tier: 3
    profiles: [C, A]
    age_bands: [all]
    requirement: Rewards are predictable and earned. Random bonus drops and slot-machine style surprises are avoided.
    rationale: Variable ratio rewards drive compulsive use. KIDS Act Art. 13(2) bans them in spending contexts on social and video services.
    improvement: Replace random bonuses with predictable milestones the child can see in advance.
    effort: low
    sources: [KIDS, KIDS-COM, R-DECI1999, R-DIXON2013]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(randomBonus|surpriseReward|dailySpin|spinTheWheel|luckyDraw|roda_?da_?sorte)'}

  - id: C-ENG-05
    title: Engagement metrics balanced by wellbeing metrics
    level: SHOULD
    tier: 3
    profiles: [C, A]
    age_bands: [all]
    requirement: Product KPIs for minors include learning and wellbeing outcomes, not only time spent, sessions or retention.
    rationale: KIDS Act Art. 10(2) asks recommender optimisation to include quality and mental health metrics; good practice for every product.
    improvement: Add learning-gain and healthy-session-length metrics to the product dashboard and goals.
    effort: low
    sources: [KIDS, KIDS-COM, EUKO, R-CERASOLI2014]
    detection:
      method: manual

  - id: C-ENG-06
    title: Challenges without anxiety timers for younger children
    level: SHOULD
    tier: 3
    profiles: [C, A]
    age_bands: [B1, B2, B3]
    requirement: Quests and challenges for under-13s avoid countdown timers and expiring rewards.
    rationale: Time pressure creates anxiety and drives compulsive return.
    improvement: Remove expiry from quests or extend them to the whole school term.
    effort: low
    sources: [KIDS-COM, UNCRC-GC25]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(expiresIn|countdown|timeLeft|questExpiry|tempo_?restante)'}

  # ================================================================ AGE-BAND MODIFIERS
  - id: AGE-B1-01
    title: Ages 3 to 5 use the product only with an adult in control
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [B1]
    requirement: >
      No child account with credentials, no text input, no external links, no notifications to
      the child, audio-first instructions, and any AI conversation only with an adult present.
    rationale: >
      KIDS Act Art. 14(1)(d) and 15(1)(d): access below 13 only through tools for guardians.
      Art. 7(4)(b) sets 3 years as the floor for guardian-controlled access to video services.
    improvement: Route access through the guardian or teacher device; remove text inputs and outbound links.
    effort: medium
    sources: [KIDS, UNCRC-GC25]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, globs: ['*.html', '*.jsx', '*.tsx', '*.vue', '*.svelte'], pattern: '<a\s[^>]*href=[''"]https?://'}

  - id: AGE-B2-01
    title: Under 10, communication uses preset messages only
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [B1, B2]
    features: [chat, multiplayer]
    requirement: No free-text chat. Communication uses preset phrases or emojis. External links are behind an adult gate.
    rationale: DSA Art. 28 guidelines on contact risks; KIDS Act Art. 12 and 15(1)(c).
    improvement: Replace chat input with a preset phrase picker.
    effort: medium
    sources: [DSA-G28, KIDS]
    detection:
      method: static
      patterns:
        - {type: regex, confidence: medium, pattern: '(sendChatMessage|chatInput|ChatInput|freeTextChat)'}

  - id: AGE-B3-01
    title: Under 13, access is enabled and controlled by a guardian or the school
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [B1, B2, B3]
    requirement: >
      Below 13, access to online games and AI conversational features is enabled and controlled
      through tools for guardians (or the school in educational deployments).
    rationale: KIDS Act Art. 14(1)(d) and 15(1)(d).
    improvement: Require a guardian or school account to activate the child's access and settings.
    effort: medium
    sources: [KIDS]
    detection:
      method: manual

  - id: AGE-B4-01
    title: Ages 13 to 15 respect the national consent age and limited features
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [B4]
    requirement: >
      Where consent is the legal basis, guardian consent is obtained below the national age of
      digital consent (13 to 16 depending on Member State). Social features follow limited-account rules.
    rationale: GDPR Art. 8. KIDS Act Art. 6(2) for social and video features (13 to 14 only with guardian-set limited accounts).
    improvement: Read the national pack for the consent age and add a guardian consent step below it.
    effort: medium
    sources: [GDPR, KIDS, EDPB-CONSENT]
    detection:
      method: manual

  - id: AGE-B5-01
    title: Ages 16 to 17 keep protective defaults
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [B5]
    requirement: >
      Older teenagers may change defaults themselves after clear information and explicit choice,
      but defaults stay protective and profiling-based recommendations stay off by default.
    rationale: KIDS Act Art. 11(2) (changes only above 15 with explicit consent) and 10(2)(b).
    improvement: Allow opt-in changes with a plain explanation; keep defaults protective.
    effort: low
    sources: [KIDS, DSA-G28]
    detection:
      method: manual

  # ================================================================ CORE: design for learning (look, sound, motion)
  # From research gathered for the EDEH Quality Compass (Nov 2026). See framework/03-design-and-motivation.md.
  - id: CORE-ACC-04
    title: Moving content and sound can be paused
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Content that moves, scrolls or animates automatically for more than 5 seconds can be paused,
      stopped or hidden, and audio that plays automatically for more than 3 seconds can be paused
      or muted.
    rationale: WCAG 2.2.2 and 1.4.2 (Level A), within the AA target of the European Accessibility Act. Uncontrolled motion distracts all learners and harms some.
    improvement: Add pause and mute controls to every auto-playing animation, video and background audio.
    effort: low
    sources: [WCAG22, EAA, EN301549]
    detection:
      method: manual

  - id: CORE-ACC-05
    title: Colour is never the only cue
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Right and wrong answers, states and instructions are signalled by shape, text, icon or sound as
      well as colour.
    rationale: WCAG 1.4.1 (Level A). About 1 in 12 boys has a colour vision deficiency, so colour-only feedback fails several children in every class.
    improvement: Add icons or text (tick, cross, label) next to colour feedback; test screens in greyscale.
    effort: low
    sources: [WCAG22, EAA]
    detection:
      method: manual

  - id: CORE-DES-01
    title: Motion and sound can be turned down or off
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      The product honours the device's reduced-motion setting and offers in-app controls to reduce
      animation and sound, including motion triggered by the learner's own actions.
    rationale: >
      WCAG 2.3.3 (Level AAA) protects learners with vestibular disorders. Distracting motion and sound
      compete with the learning content for attention.
    improvement: Wrap animations in a reduced-motion check (CSS prefers-reduced-motion, useReducedMotion, platform accessibility APIs) and add 'calm mode' and sound sliders.
    effort: low
    sources: [W3C-233, WCAG22, R-SUNDARARAJAN2020]
    detection:
      method: static
      patterns:
        - {type: repo, check: reduced_motion_missing, confidence: medium}

  - id: CORE-DES-02
    title: Motion shows the content, not decoration
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Animation is used to show what is learned (a process, a change over time, a procedure).
      Decorative, celebratory or purely entertaining motion and interesting-but-irrelevant extras
      ("seductive details") are kept to a minimum.
    rationale: >
      Seductive details lower learning (g = -0.33, 58 studies). Animation that depicts the content
      improves it (g = 0.23, 140 comparisons). In e-books, story-carrying animation helps young
      children while hotspots and side games distract.
    improvement: For each animation, write down what it teaches. Remove or shorten the ones that teach nothing; move side games out of the learning path.
    effort: medium
    sources: [R-SUNDARARAJAN2020, R-BERNEY2016, R-TAKACS2015]
    detection:
      method: manual

  - id: CORE-DES-03
    title: Calm screens, especially under 8
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [B1, B2]
    requirement: >
      Few elements compete on screen at once (as a guide, no more than four interactive or animated
      elements on the main screen for under-8s), and help is available as audio or pictures, not text only.
    rationale: >
      Busy visual environments increase off-task time in young children and affect autistic children
      most. A content analysis of 200 apps for under-8s found 95% showed more than four elements on
      the opening screen.
    improvement: Audit each screen's element count; move secondary elements into menus; add spoken help.
    effort: medium
    sources: [R-FISHER2014, R-HANLEY2017, R-CAC2018, R-HIRSHPASEK2015]
    detection:
      method: manual

  - id: CORE-DES-04
    title: Fantasy does not blur facts for young children
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [B1, B2]
    requirement: >
      When teaching facts about the real world to young children, use realistic images and plain
      language. Talking animals, impossible events and fantasy framing are kept for stories and play,
      not for factual content.
    rationale: >
      Human-like animals with human-like language reduced fact learning in 3 to 5-year-olds.
      Fantastical events, more than pace, reduced executive function in 4-year-olds.
    improvement: Review factual units for young children; replace anthropomorphic narration with realistic visuals or clearly separate story from fact.
    effort: medium
    sources: [R-GANEA2014, R-LILLARD2011]
    detection:
      method: manual

  - id: CORE-DES-05
    title: Visual style matches the concept, especially in maths
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Abstract concepts use simple, schematic visuals. Graphs and diagrams carry no decorative
      pictures. Concrete images are used to start, then faded towards abstract representations.
      Pleasant colours and friendly faces are welcome where they do not compete with the content.
    rationale: >
      Pictures inside graphs led 6 to 8-year-olds to count the pictures; generic symbols transfer
      better than concrete ones. Schematic visuals outperform cartoon and realistic ones in learning
      games. Emotional design (pleasant colours, faces) improves retention (d = 0.39).
    improvement: Remove decoration from graphs and diagrams; plan concrete-to-abstract fading in maths sequences; keep warm, pleasant colour palettes.
    effort: medium
    sources: [R-KAMINSKI2013, R-WOUTERS2013, R-BROM2018]
    detection:
      method: manual

  - id: CORE-DES-06
    title: Celebrations are short and proportional
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Reward animations and sounds are brief, proportional to the achievement and skippable. Win
      sounds are not used to make small or no progress feel like a big win.
    rationale: >
      Each celebration is itself a seductive detail competing for attention. In slot machines, win
      sounds made players overestimate how often they won.
    improvement: Cap celebration length (e.g. under 2 seconds), scale them to the achievement, and allow skipping.
    effort: low
    sources: [R-SUNDARARAJAN2020, R-DIXON2013]
    detection:
      method: static
      patterns:
        - {type: dependency, confidence: medium, names: [canvas-confetti, react-confetti, react-canvas-confetti, js-confetti, party-js, confetti-js]}

  - id: CORE-DES-07
    title: No colour-psychology claims
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Design decisions and product claims do not rely on popular colour-psychology effects
      (e.g. "red lowers performance") that are not supported by robust evidence.
    rationale: The red-colour effect on cognitive performance does not survive correction for publication bias.
    improvement: Justify colour choices by function (contrast, coding, highlighting) and accessibility, not by colour-psychology claims.
    effort: low
    sources: [R-GNAMBS2020]
    detection:
      method: manual


  - id: CORE-DES-08
    title: Families and lives are shown without one default model
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Content about families, homes and daily life does not assume one model (a mother and a father,
      living grandparents, siblings, a room of one's own, holidays, money for extras). Every activity
      works with any answer, including "I don't have one" and "I'd rather not say", and families of
      many shapes appear in examples and illustrations. Themes such as loss, illness, separation or
      moving home come with a content note for the teacher, a calm exit for the child and a debrief.
    rationale: >
      Children in care, bereaved, in single-parent, same-sex-parent or reconstituted families, or
      living in poverty should not feel excluded or have to explain themselves (non-discrimination,
      UN General Comment 25). Same aim as B-SIM-01, for every profile and every content type.
      Inclusion is one of the EU quality criteria for digital education content.
    improvement: Review family-themed content with a teacher and a school psychologist, add "I don't have one" paths, and add content notes for sensitive themes.
    effort: low
    sources: [UNCRC-GC25, EU-DEC, ET4G2]
    detection:
      method: manual

  # ================================================================ MOTIVATION (profiles A, B, C)
  - id: A-MOT-01
    title: Rewards are for learning, and the inventory shows it
    level: SHOULD
    tier: 3
    profiles: [A, B, C]
    age_bands: [all]
    requirement: >
      Points, stars and unlocks are tied to learning progress or effort, not to time spent, number of
      sessions or returning at set times. The team keeps a reward inventory (points, coins, badges, streaks,
      levels, leaderboards, unlockables, celebrations) and records for each one whether it is given for
      learning or for showing up. No more than two layers are given for playing time, logging in or simply
      finishing.
    rationale: >
      Expected rewards for doing a task lower later intrinsic motivation (d = -0.36), more in children.
      Badges plus leaderboards lowered motivation and exam scores over a semester. Each extra layer makes
      rewards more expected and more controlling. Aligning game mechanics with learning mechanics (LM-GM)
      avoids engagement for its own sake. Merges A-ECO-04 (retired in 0.11.0). Related: C-ENG-01 (streaks),
      C-ENG-04 (variable rewards), A-MOT-03 (rewards off), CORE-DES-06 (celebrations).
    improvement: Write the reward inventory (one line per layer, 'for learning' or 'for showing up'); map each reward to a learning mechanic (LM-GM); remove or convert layers given for time, logins or showing up.
    effort: low
    sources: [R-DECI1999, R-HANUS2015, R-MEKLER2017, R-SAILER2020, R-RADESKY2022, ARNAB2014, KIDS-COM, R-HIRSHPASEK2015]
    detection:
      method: mixed
      patterns:
        - {type: repo, check: reward_layers, confidence: medium}


  - id: A-MOT-02
    title: Feedback informs, it does not control
    level: SHOULD
    tier: 3
    profiles: [A, B, C]
    age_bands: [all]
    requirement: >
      Feedback says what the learner did well and why, and what to try next. Copy avoids controlling
      language ("you must", "you have to") and external goal framing ("do this to win coins").
    rationale: >
      Informational verbal feedback raised intrinsic motivation (+0.33). Controlling language and
      external goal framing undermined conceptual learning in 11 to 12-year-olds, while drill scores
      looked fine, so the loss is easy to miss.
    improvement: Rewrite feedback strings as specific, informational messages; review copy for 'must' and reward-centred goals.
    effort: low
    sources: [R-DECI1999, R-VANSTEENKISTE2005]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(you must (finish|complete|play|keep)|you have to (finish|play|keep)|play to earn|win (more )?coins|tens de (acabar|jogar|continuar)|joga para ganhar)'}

  - id: A-MOT-03
    title: The product works with rewards switched off
    level: SHOULD
    tier: 3
    profiles: [A, C]
    age_bands: [all]
    requirement: >
      The teacher can switch off points, leaderboards and celebrations, or turn competition into a
      shared class or team goal, and the activity still makes sense. Teacher materials include debrief
      prompts that turn rewards into information ("What did you do to earn that?").
    rationale: >
      Gamification's cognitive gains are robust, but motivational gains vanish in rigorous studies;
      competition combined with collaboration beats competition alone. Leaderboards reward those
      already ahead and hurt the weakest.
    improvement: Add teacher toggles for each reward layer and a 'team goal' mode; add debrief questions to the teacher guide.
    effort: medium
    sources: [R-SAILER2020, R-HANUS2015, R-HIRSHPASEK2015]
    detection:
      method: manual

  - id: A-MOT-04
    title: Room for curiosity
    level: SHOULD
    tier: 3
    profiles: [A, B, C]
    age_bands: [all]
    requirement: >
      The design includes open questions, things to explore, choices with consequences, and moments
      where learners explain their reasoning to each other. Success is not only a count of completed items.
    rationale: >
      Curiosity improves memory through the same reward circuit that responds to coins, and predicts
      achievement, more strongly for children in poverty. Intrinsic motivation predicts quality of work
      and well-being; incentives predict quantity. Intrinsic motivation already declines through school.
    improvement: Add at least one exploratory or explain-your-reasoning moment per unit; track learning quality, not only items completed.
    effort: medium
    sources: [R-GRUBER2014, R-SHAH2018, R-CERASOLI2014, R-HOWARD2021, R-LEPPER2005]
    detection:
      method: manual

  - id: A-MOT-05
    title: Helping and creativity are recognised, not paid
    level: SHOULD
    tier: 3
    profiles: [A, B, C]
    age_bands: [all]
    requirement: >
      Helping others and cooperating are not paid with points or items. Creative tasks reward creative
      quality with informative feedback, not mere completion.
    rationale: >
      Toddlers rewarded with a toy for helping later helped less. Rewards for completing creative tasks
      lower creativity; recognising creative quality with fair feedback can help.
    improvement: Replace point payouts for helping with acknowledgement; give creative tasks qualitative feedback instead of completion rewards.
    effort: low
    sources: [R-WARNEKEN2008, R-BYRON2012]
    detection:
      method: manual

  # ================================================================ COMMERCIAL PRACTICES (KIDS Act Recital 31, Art. 13)
  - id: CORE-COM-05
    title: Purchases are labelled as purchases, in real time
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [purchases]
    requirement: >
      Before any purchase or spending of purchasable currency, the child is told in clear, age-appropriate
      words (and icons or audio for non-readers) that this is a purchase that costs real money, at the
      moment it happens, with the price in the national currency.
    rationale: >
      KIDS Act Art. 13(1) and Recital 31: minors often do not understand the consequences of online
      transactions, so purchases must be labelled as economic transactions in real time. Binding for social
      and video services and AI chatbots (Art. 14(1)(c)); applied to games and learning apps as good practice.
    improvement: Add a purchase confirmation screen for child accounts that says "This costs money" with the euro price and requires an adult step.
    effort: low
    sources: [KIDS, UCPD, DFA]
    detection:
      method: manual

  - id: CORE-COM-06
    title: No design for impulsive or unwanted spending
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [purchases]
    requirement: >
      No one-tap or in-content purchases for children. There is a clear separation and friction between
      learning or play content and buying anything related to it (for example a separate adult area and a
      confirmation step). No spending prompts at moments of frustration, failure or excitement.
    rationale: >
      KIDS Act Art. 13(2) and Recital 31: services must not be designed in a way that leads to excessive,
      impulsive or unwanted spending, including through separation or friction between content and
      purchases. DFA proposal targets the same practices.
    improvement: Move every purchase out of the child experience into a guardian or school area; remove purchase buttons from gameplay, results and failure screens.
    effort: medium
    sources: [KIDS, DFA, UCPD, R-RADESKY2022]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, pattern: '(oneClick(Buy|Purchase)|oneTap(Buy|Purchase)|instantPurchase|quickBuy|skipPurchaseConfirm(ation)?|autoPurchase|purchaseWithoutConfirm)'}

  - id: CORE-COM-07
    title: No disguised advertising
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Paid promotion is never presented as learning content, game content or a character's own opinion.
      Any sponsorship, product placement or brand partnership is clearly identified as such, in words a
      child of the target age understands.
    rationale: >
      UCPD Annex I point 11 bans editorial content paid for by a trader without making that clear, and
      point 28 bans direct exhortations to children to buy. DSA Art. 26 requires ads on platforms to be
      clearly identifiable. KIDS Act Recital 31 names product placement, influencer marketing and
      sponsorship as tactics with particular persuasive effects on minors.
    improvement: Label any commercial content clearly (e.g. "Ad" or "Paid partnership" with an icon); remove promotion voiced by characters or tutors.
    effort: low
    sources: [UCPD, DSA, KIDS]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(sponsoredBy|isSponsored|productPlacement|brandedContent|paidPartnership|partnerContent|conte[uú]do patrocinado|patrocinado por)'}

  - id: CORE-COM-08
    title: No commercial content inside learning activities for children
    level: SHOULD
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Learning activities for children contain no product placement, branded rewards, sponsored
      characters or influencer endorsements, even when labelled. Funding and partner credits, if any,
      appear only in adult-facing areas.
    rationale: >
      Children, especially under 8, struggle to recognise persuasive intent even when content is labelled.
      Recital 31 of the KIDS Act lists these tactics among those with particular persuasive effects on
      minors; UN General Comment 25 asks states to protect children from commercial exploitation.
    improvement: Remove brands and sponsored items from learning content; move partner credits to the teacher or guardian area.
    effort: low
    sources: [KIDS, UNCRC-GC25, R-RADESKY2022]
    detection:
      method: manual

  # ================================================================ AI COMPANIONS AND CHATBOTS (KIDS Act Recitals 32-34, Art. 14)
  - id: CORE-AI-08
    title: Conversation memory is off by default
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      AI systems do not keep or reuse information from a child's previous conversations by default,
      except where necessary to protect the child's safety. Any memory is visible to the teacher or
      guardian and can be deleted.
    rationale: >
      KIDS Act Art. 14(1)(b) and Recital 32: persistent conversational memory with minors must be disabled
      by default, to prevent accumulating sensitive data and reinforcing harmful interaction patterns.
      GDPR data minimisation and storage limitation.
    improvement: Start each session without past context; if continuity is needed for learning progress, store structured progress data (e.g. skills mastered), not chat transcripts.
    effort: low
    sources: [KIDS, GDPR]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, pattern: '(persistentMemory|longTermMemory|conversationMemory|memoryEnabled|rememberConversations|enableMemory)\s*[:=]\s*true'}

  - id: CORE-AI-09
    title: AI is red-teamed before release, re-tested regularly and monitored
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      Before release, AI features are red-teamed with a prompt set per age band and language. They are
      re-tested at regular intervals and on every model or prompt change. After release, incidents involving
      children are detected, logged, assessed and acted on, with a named owner.
    rationale: >
      KIDS Act Art. 14(1)(e)(f) and Recitals 32 and 33. The legal duty of post-market monitoring does not
      apply to micro and small enterprises; CSEF applies it to every provider because the risk to a child
      does not depend on company size. Risk mitigations by the provider of the underlying general-purpose
      model (AI Act Art. 55) can be relied on in part, but are not sufficient on their own.
    improvement: Build a red-team prompt set per age band and language; run it in CI on prompt changes and at least each term; add an incident channel for teachers and guardians and a monthly review.
    effort: medium
    sources: [KIDS, AIA]
    detection:
      method: manual


  - id: CORE-AI-10
    title: An AI assistant inside a game or app is opt-in and easy to leave
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      When an AI chatbot or companion is a feature of a game, app or platform, it is not switched on
      automatically, not displayed prominently (e.g. not pinned at the top of contacts or the home screen),
      children are not encouraged to use it, and they can turn it off easily at any time.
    rationale: >
      KIDS Act Art. 14(2) and Recital 34, which cover AI companions and chatbots deployed as a functionality
      of online games and platforms, including where in-game purchases can occur.
    improvement: Default the assistant to off (or teacher-enabled), place it behind a neutral help entry, and add a visible "turn off assistant" setting.
    effort: low
    sources: [KIDS]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, pattern: '(assistantEnabled|chatbotEnabled|aiChatEnabled|aiCompanionEnabled|autoOpenChat|autoStartAssistant|showAssistantOnStart)\s*[:=]\s*true'}

  - id: CORE-AI-11
    title: AI never nudges children to spend or towards ads
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      AI tutors, characters and assistants never suggest purchases, upgrades, premium content or
      advertised products, and are not optimised for spending or engagement time.
    rationale: >
      KIDS Act Recital 31 names AI-enhanced nudging as a commercial tactic with particular effects on minors;
      Art. 14(1)(c) applies the economic transaction safeguards to AI companions and chatbots, and Recital 34
      extends safeguards to chatbots inside games with in-game purchases. AI Act Art. 5(1)(b) bans AI that
      exploits age-related vulnerability.
    improvement: Remove commercial goals from system prompts and fine-tuning data; add red-team prompts that try to elicit upsell and test that the AI refuses.
    effort: low
    sources: [KIDS, AIA, UCPD]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(upsell|encourage (the )?(user|child|student|player) to (buy|purchase|upgrade|subscribe)|promote (the )?(premium|shop|store|subscription))'}

  - id: CORE-AI-12
    title: Generative features cannot depict real people
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [ai_generative]
    requirement: >
      Generative features cannot make images, video or voices of real, identifiable people, other children
      above all. In practice: (1) no photo, video or voice recording of a person goes into generation, and
      there is no face swap, voice cloning or editing of photos of people; (2) prompts that name someone on the
      class list, or another real person, are refused, checked against the roster inside the product; (3)
      uploaded images are checked for faces and refused for generation, without identifying anyone; (4)
      generated media is labelled as made by AI and carries provenance data; and (5) a child can report "this
      is about me", and that report is handled first.
    rationale: >
      A classmate's face or voice is personal data, and nobody in the class can consent for them (GDPR Art. 5
      and 6; CORE-DAT-14). The EU action plan against cyberbullying names deepfake abuse. Directive (EU)
      2024/1385 requires Member States to make sexual deepfakes a crime, and the AI Omnibus adds a ban on AI
      systems that generate non-consensual intimate images. Labels follow AI Act Art. 50. Blocking real
      people at the input is far more reliable than filtering the output.
    improvement: Remove image-to-image, face swap and voice cloning from child-facing features; check prompts against the class roster; refuse uploads with faces for generation; add provenance metadata (for example C2PA) and a priority "this is about me" report.
    effort: medium
    sources: [GDPR, AIA, AIA-OMNIBUS, VAW-DIR, CB-AP]
    detection:
      method: mixed
      patterns:
        - {type: dependency, confidence: medium, names: [insightface, facefusion, roop, simswap, deepfacelab, faceswap, rvc-python, so-vits-svc-fork, openvoice]}
        - {type: regex, confidence: medium, flags: i, pattern: '(face_?swap|swap_?face|voice_?clon|clone_?voice|img2img|image_?to_?image)'}


  # ================================================================ COMMUNICATIONS (KIDS Act Art. 12, 15(2), Recital 36; DSA)
  # Detection uses the communications inventory (tooling/comms.py). Absence of a safeguard in code is a
  # signal, not proof: many chat services configure moderation in a dashboard. Findings are REVIEW.
  - id: CORE-CHT-01
    title: Every communication channel is declared
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    requirement: >
      Every way children can communicate or act towards each other is declared in csef.yaml features and
      listed in the DPIA, with the service used and where data is processed. That includes text chat, direct
      messages, comments, voice, video and live streaming, and also channels without text: emotes and
      reactions, avatar names and looks, drawings and shared creations, and actions in shared worlds
      (building, destroying, following or trapping another child's avatar).
    rationale: >
      Accountability (GDPR Art. 5(2)) and the DPIA require knowing every channel. Contact risks are the main
      reason the KIDS Act regulates online games (Recital 36). Bullying uses whatever channel exists, words or
      not. Undeclared channels escape every other check.
    improvement: Add the channel to `features` (chat, multiplayer, social or ugc) and to `third_parties`; list non-text channels too; update the DPIA.
    effort: low
    sources: [GDPR, KIDS, DSA-G28]
    detection:
      method: static
      patterns:
        - {type: repo, check: comms_undeclared, confidence: high}


  - id: CORE-CHT-02
    title: Report and block in every channel
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      In every channel, those without text included (CORE-CHT-01), a child can report a message, a creation
      or a user in one step, and block any user without the blocked user being told who blocked them. The
      reported content is kept as evidence for the person who handles it. What the child hears after a
      report is in CORE-SAF-06.
    rationale: >
      DSA Art. 16 (notice and action) applies to hosting services. KIDS Act Art. 12(1)(d) (block without
      identity disclosed) and Art. 19 (child-friendly reporting). DSA Art. 28 guidelines.
    improvement: Add report and block actions to every message, creation and profile; route reports to a moderation queue with priority for minors.
    effort: medium
    sources: [DSA, KIDS, DSA-G28]
    detection:
      method: mixed
      patterns:
        - {type: repo, check: comms_report_block, confidence: medium}


  - id: CORE-CHT-03
    title: Moderation by people and by tools
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Communication is moderated by named people (a teacher in school use, trained moderators otherwise) who can
      hide, remove, mute and suspend, supported by automated filters for text and images in the product's
      languages, with rate limits against spam. The level of moderation matches the age band.
    rationale: >
      KIDS Act Recital 36 lists cyberbullying, harassment, grooming, sexual exploitation, recruitment and
      radicalisation as contact risks in online games. DSA Art. 28 guidelines on moderation for minors.
    improvement: Give teachers or moderators hide/remove/mute/suspend powers; add a text filter (word list plus a moderation API) and image checks for uploads; add rate limits.
    effort: high
    sources: [KIDS, DSA-G28, DSA]
    detection:
      method: mixed
      patterns:
        - {type: repo, check: comms_moderation, confidence: medium}

  - id: CORE-CHT-04
    title: Direct messages only with approved contacts; groups only with agreement
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Nobody can start a private conversation with a child unless the child (or, under 13, the guardian or
      teacher) has approved that contact. Children are added to groups only with their agreement. Nobody can
      pressure a child into approving contact.
    rationale: KIDS Act Art. 12(1)(a)(c) and 12(2), applied to online games by Art. 15(1)(c) for 12(1).
    improvement: Restrict direct messages to approved contacts within the class or group; require acceptance for group invitations.
    effort: medium
    sources: [KIDS, DSA-G28]
    detection:
      method: mixed
      patterns:
        - {type: repo, check: comms_direct_messages, confidence: medium}

  - id: CORE-CHT-05
    title: No links, handles or contact details in children's messages
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Messages to and from children block or warn on external links, social media handles, phone numbers,
      emails and addresses, so the product cannot be used to move children to other services.
    rationale: >
      KIDS Act Art. 15(2) and Recital 36 (restrict link-outs, warning messages, prevent enticing minors to other
      services); Art. 12(3)(c) (contact details of minors never shared).
    improvement: Filter URLs, handles and contact details before delivery; show a warning to the child and notify moderation.
    effort: medium
    sources: [KIDS]
    detection:
      method: mixed
      patterns:
        - {type: repo, check: comms_link_filter, confidence: medium}

  - id: CORE-CHT-06
    title: Voice, video and live streaming off by default
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    requirement: >
      Voice chat, video chat and live streaming are off by default, enabled only by a guardian or teacher for
      under-13s, limited to approved contacts, and children cannot host live streams by default.
    rationale: KIDS Act Art. 11(1) (camera, microphone) and Art. 12(3)(f) (no hosting of real-time transmissions by default). DSA Art. 28 guidelines.
    improvement: Default voice and video to off; add guardian or teacher activation; restrict to class groups; remove child-hosted streaming.
    effort: medium
    sources: [KIDS, DSA-G28]
    detection:
      method: mixed
      patterns:
        - {type: repo, check: comms_voice_default_on, confidence: high}
        - {type: repo, check: comms_voice_video, confidence: medium}

  - id: CORE-CHT-07
    title: Children's shared media is protected
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Images and files sent in messages are checked automatically, visible to the responsible teacher or
      moderator, and cannot be downloaded or forwarded by other users. Contact and account information of
      children is never visible to people they have not accepted.
    rationale: KIDS Act Art. 12(3)(a)(b)(e). DSA Art. 28 guidelines.
    improvement: Add image checks on upload, disable download and forwarding of children's media, and restrict profile visibility.
    effort: medium
    sources: [KIDS, DSA-G28, GDPR]
    detection:
      method: mixed
      patterns:
        - {type: repo, check: comms_media, confidence: medium}

  - id: CORE-CHT-08
    title: Safeguarding procedure with a route for each kind of harm
    level: MUST
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication, survey, ai_generative]
    requirement: >
      There is a written safeguarding procedure with a named lead. It sets a route for each kind of harm:
      grooming, sexual exploitation, extortion, threats, self-harm signals and radicalisation in
      communication; and disclosures of harm (abuse, self-harm, bullying, danger at home) in free-text or voice
      answers, drawings and AI conversations. It says how each is recognised and escalated, how evidence is
      kept, and when guardians, schools, hotlines and authorities are contacted. A disclosure goes to the
      safeguarding lead named by the school, never automatically to guardians (who may be the source of
      harm) or to peers, and the child sees in age-appropriate words where to get help now. No AI analysis
      scans answers for risk without a DPIA and human review. Moderators are trained and supported. Bullying
      between children follows CORE-CHT-15.
    rationale: >
      KIDS Act Recital 36 names these contact risks. Children disclose in unexpected places, and a disclosure
      left in a log or sent to the wrong adult can put the child in danger (UN General Comment 25). National
      child-protection law decides who must act. Code cannot show this; it is the human side of every other
      communication rule. Merges CORE-SAF-11 (retired in 0.11.0).
    improvement: Write the procedure with the DPO and a safeguarding lead; agree a disclosure route with each school; prefer closed answers where free text is not needed; train moderators and teachers; test the procedure with a tabletop exercise each year.
    effort: medium
    sources: [KIDS, DSA-G28, UNCRC-GC25, BIK]
    detection:
      method: mixed
      patterns:
        - {type: manifest, check: survey_free_text_without_route, confidence: high}


  - id: CORE-CHT-09
    title: Messages are kept only as long as needed
    level: SHOULD
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Messages have a defined retention period enforced by code, children and teachers can delete them, and
      reported messages are preserved only for the investigation.
    rationale: GDPR storage limitation (Art. 5(1)(e)) and erasure (Art. 17).
    improvement: Add a retention job for messages and keep reported messages in a separate, access-controlled store.
    effort: low
    sources: [GDPR]
    detection:
      method: manual
  - id: CORE-CHT-10
    title: Reports stay confidential
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Do not show who reported. The reported child, other children and their guardians are never told who
      made a report, and nothing in the product lets them work it out: no "reported by" label, no shared
      report count, no action timed to point at one child. Only the person handling the report, and the
      safeguarding lead where needed, can see the reporter. If the school's procedure later needs the
      reporter's name, the reporter and their guardian are told first.
    rationale: >
      Fear of being found out stops children from reporting. The EDPB says notice mechanisms should allow,
      but not require, identifying the notifier, and reveal the identity to the affected user only where
      strictly necessary. The KIDS Act proposal already protects the identity of whoever blocks (Art.
      12(1)(d)), but no law says the same for every product's reports, so this is a SHOULD.
    improvement: Remove reporter names from every view the reported child or peers can see; batch or delay visible moderation actions; limit reporter identity to the moderator role.
    effort: low
    sources: [EDPB-DSAGDPR, GDPR, CB-AP, KIDS]
    detection:
      method: manual


  - id: CORE-CHT-11
    title: Children can report for a friend; misuse is handled by people
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      A child can report something that happens to someone else ("this is happening to a friend"), from the
      same place as any report, without the friend's permission and without proof. The friend is offered
      help privately, and the report follows CORE-SAF-06 and CORE-CHT-10. Good practice: (1) the flow asks
      what happened, nothing more; (2) a report made in good faith that turns out unfounded never counts
      against the child; (3) only repeated reports that a person finds manifestly unfounded are recorded,
      seen only by the moderator or teacher and never by other children; (4) the child first gets a kind
      warning that explains why, before any limit; (5) there are no automatic sanctions; and (6) many reports
      against the same child by a group are treated as a possible sign of bullying, not as proof against
      that child.
    rationale: >
      Bystanders often see what adults do not, and the EU action plan against cyberbullying asks that
      reporting and support reach bystanders. DSA Art. 23 lets online platforms, after a warning, stop
      handling notices from people who often send manifestly unfounded ones; for children the answer is a
      conversation with an adult, not a penalty. Reporting itself can be used to bully, so patterns matter
      more than counts.
    improvement: Add "this is happening to someone else" to the report flow and a private help message for the friend; record manifestly unfounded reports for the moderator only, with a warning step and no automatic sanctions; flag group reports against one child for review.
    effort: medium
    sources: [CB-AP, DSA, UNCRC-GC25]
    detection:
      method: manual


  - id: CORE-CHT-12
    title: No design that lets children exclude, rank or expose each other
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      The design gives children no tools to exclude, rank or expose each other: (1) no voting a child out of
      a game, team or group, and no removal of players by other players; only the teacher or a moderator
      can remove; (2) no ratings of children by children (stars, scores or likes on a person, "best" or
      "worst" player votes); feedback on someone's work uses preset kind options or a rubric the teacher can
      see; (3) no polls or questions about classmates; (4) teams and pairs are made by the teacher or by the
      product (at random or balanced), never picked by children in front of others, and nobody sees the order
      of choice; (5) paid or premium items do not show status to classmates, and the school can turn their
      display off; (6) friend lists, friend counts and online status are not shown to other children; and (7)
      the teacher can keep two children apart in pairings and groups without anyone seeing why.
    rationale: >
      The EU common definition of cyberbullying includes social exclusion. Most cyberbullying comes from
      peers the child knows from school, so closed class groups keep strangers out but not the bully.
      Design that lets children vote others out, rate each other or show status hands them that power. Not
      law as such, so a SHOULD. Related: CORE-SAF-10 (no follower counts or likes on appearance), C-ENG-02
      (leaderboards).
    improvement: Replace vote-kick with removal by the teacher or a moderator; remove ratings of people and polls about classmates; make teams by teacher choice or at random; hide paid status and friend counts in school use; add a "keep apart" setting for teachers.
    effort: medium
    sources: [CB-AP, UNCRC-GC25, R-JUVONEN2008, R-WOLKE2017]
    detection:
      method: mixed
      patterns:
        - {type: regex, confidence: medium, flags: i, pattern: '(vote_?kick|kick_?vote|vote_?to_?kick|rate_?(player|classmate|student)|player_?rating|popularity_?(poll|vote|rank)|hot_?or_?not)'}


  - id: CORE-CHT-13
    title: Children can keep evidence and reach national help
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      A child who reports can keep a record of what happened inside the product (what was said or done,
      when, by which account), see it later and share it with a trusted adult, the school or a helpline,
      without downloading or forwarding other children's media (CORE-CHT-07). The product links to the
      national child helpline (116 111) and Safer Internet Centre, and connects its reporting and support to
      the EU online safety app through the app's interface where the country offers it. The record follows
      the retention rules (CORE-CHT-09).
    rationale: >
      The EU action plan against cyberbullying plans an app where children report to a national helpline,
      store and pass on evidence and get help, and which platforms can connect to their reporting and support
      tools through APIs. The KIDS Act proposal asks Member States for free, confidential national channels
      that complement providers' reporting tools. Not yet an obligation for providers, so a SHOULD.
    improvement: Add a "my reports" view with the evidence record and a share option to a trusted adult or helpline; add national helpline links; plan the connection to the national app.
    effort: medium
    sources: [CB-AP, KIDS, BIK]
    detection:
      method: manual


  - id: CORE-CHT-14
    title: Communication is open only when someone can respond
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      The product says who handles reports (the teacher, the provider's moderators or both), in which hours
      and languages, and how fast: for example urgent safety reports within one hour and other reports
      within one school day while communication is open. Outside those hours communication is closed,
      limited to preset messages, or covered by the provider's moderators. Teachers can set open hours for
      their class. A child who reports is told when to expect an answer. The cover is declared in csef.yaml
      (`moderation`) and checked against real response times.
    rationale: >
      A report nobody reads protects nobody. When the teacher is the moderator, chat that stays open in the
      evening has no one behind it. KIDS Act Art. 19 and the DSA Art. 28 guidelines expect reports to be
      handled promptly. CORE-CHT-03 names the people; this rule makes sure their time covers the hours the
      channel is open. What the product can safely offer depends on who can respond.
    improvement: Add open hours set by the teacher; close or limit communication outside covered hours; declare `moderation` in csef.yaml and measure response times.
    effort: medium
    sources: [KIDS, DSA-G28, CB-AP]
    detection:
      method: mixed
      patterns:
        - {type: manifest, check: moderation_coverage_missing, confidence: medium}


  - id: CORE-CHT-15
    title: Bullying between children follows the school's procedure, or a default one
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [communication]
    requirement: >
      Strongly recommended. A report about bullying between children goes to the person named in the
      school's anti-bullying plan or procedure, not to the authorities and not straight to guardians. If the
      school has no plan, the product offers a default procedure that the school accepts at set-up
      (templates/bullying-procedure.md): who is told, how to listen to both children, how to keep them apart
      in the product (CORE-CHT-12), how guardians are informed through the school, when to check again, and
      when it becomes a safeguarding matter (CORE-CHT-08). Report categories follow the EU common definition
      of cyberbullying (humiliating, excluding, abusing, harassing or harming, once or repeated) in words for
      children, and the school sees totals per category for its classes, never figures that point to one
      child (at least 5 per figure, as in CORE-DAT-17).
    rationale: >
      Most online bullying is between children who know each other from school, so the school is usually the
      right place to act. Many schools have an anti-bullying plan (in Portugal, "Escola Sem Bullying. Escola
      Sem Violência"), but not all, so the product must work without one. Shared categories let schools and
      Member States compare data, as the EU action plan asks. Not law, so a SHOULD, but strongly recommended
      for any product with communication.
    improvement: Ask at set-up for the school's anti-bullying contact, or for acceptance of the default procedure; route bullying reports there; use the EU-definition categories; give schools totals by class and school.
    effort: medium
    sources: [CB-AP, UNCRC-GC25, R-JUVONEN2008]
    detection:
      method: mixed
      patterns:
        - {type: manifest, check: bullying_route_missing, confidence: medium}


