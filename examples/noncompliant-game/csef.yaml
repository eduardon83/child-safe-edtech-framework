# Deliberately non-compliant example used by the test-suite.
cses_version: "0.1"
product: Word Quest (bad example)
profiles: [A, C]
age_bands: [B2, B3]
compliance_level: 2
jurisdictions: [EU, PT]
context: home
gdpr_role: controller
legal_scope:
  kids_act: unknown
features: [multiplayer, chat, notifications, streaks, leaderboards, purchases, ai_generative]
monetisation: in_app_purchases
third_parties:
  - name: Example Analytics Inc.
    purpose: product analytics
    region: us-east-1
    dpa_signed: false
# Learning data (framework/08-learning-data.md): logs events, shows detector labels per child and publishes
# small groups. Each line below breaks a CSEF rule on purpose.
data_collection:
  event_standard: custom
  event_catalogue: docs/event-catalogue.yaml     # does not exist
  purposes: [operation, research]
  player_id: {kind: hashed_email, scope: company}
  cross_product_linking: true
  detectors: teacher_view
  research: {default_on: true}
  open_evidence:
    ontology: custom
    min_players: 5
    min_classes: 1
