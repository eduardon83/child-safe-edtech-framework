# Text admin for CSEF and HDSF. See README.md for setup.
name = "framework-text-admin"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Keep variables added in the Cloudflare dashboard when GitHub redeploys the Worker.
keep_vars = true

# The admin page (public/) is served as static assets. Requests to /api/* run the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Secrets, set once with "npx wrangler secret put NAME":
#   GITHUB_TOKEN    fine-grained token with Contents: read and write (and Actions: read) on both repositories
#   SESSION_SECRET  a long random string, at least 32 characters
#   EDITORS         the contents of editors.json, made with tools/add-editor.mjs

# Slows down password guessing: at most 5 sign-in attempts per minute for each address and email.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Optional, your own address. kendirstudios.pt must be a zone in your Cloudflare account:
# routes = [ { pattern = "admin.kendirstudios.pt", custom_domain = true } ]
