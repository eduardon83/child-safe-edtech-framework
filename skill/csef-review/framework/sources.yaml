    verified: 2026-11-11

  - id: AIA-OMNIBUS
    title: "Digital Omnibus on AI: Regulation amending the AI Act (reported as Regulation (EU) 2026/1744)"
    type: law
    jurisdiction: EU
    status: "Adopted by Parliament 16 Jun 2026 and Council 29 Jun 2026; published in the Official Journal 24 Jul 2026; in force 27 Jul 2026. Annex III high-risk obligations (incl. education) apply from 2 Dec 2027. Art. 4 AI literacy becomes a duty to take measures to support AI literacy"
    url: "https://fpf.org/blog/the-ai-act-implementation-timeline-what-changes-under-the-ai-omnibus"
    notes: "Secondary sources (FPF, law firms). Replace with the EUR-Lex reference of the consolidated text when cited."
    verified: 2026-11-14

  - id: KIDS
