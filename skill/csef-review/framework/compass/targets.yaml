    need: 1

  # ================================================================ TRN: transparency that teaches (design lens)
  - id: TRN-01
    axis: TRN
    title: Child-friendly explanation of how the product works and what data it uses
    scope: universal
    age_bands: [all]
    target: Children get a short, age-appropriate explanation of what the product does, what data it uses and why, inside the product.
    why: GDPR Art. 12 asks for clear language for children; the DSA Art. 28 guidelines and General Comment 25 ask for child-friendly information.
    look_for: Child-facing explainers, onboarding, or a data page written for the age band.
    ideas: [How-this-game-works card at first launch, My-data page with icons]
    improvement: Write a child-facing explainer of the product and its data use, tested with the age band.
    refs: {DIGCOMP3: ["4.2"]}
    sources: [GDPR, DSA-G28, UNCRC-GC25, IEEE2089]
    terms: [[child friendly, age appropriate, plain language, simple language, for children, kid friendly, linguagem simples, adequada a idade, para criancas, linguagem acessivel], [data, how it works, how the game works, privacy, dados, como funciona, privacidade]]

  - id: TRN-02
    axis: TRN
    title: AI disclosure that teaches its limits
    scope: feature
    features: [ai_generative, ai_adaptive, ai_assessment]
    age_bands: [all]
    target: Wherever AI is used, children are told it is AI, what it can and cannot do, and that it can be wrong, in age-appropriate words.
    why: AI Act Art. 50 requires disclosure; AILit Engage 2 and 3 turn disclosure into learning; the KIDS Act proposal and UNICEF guidance ask for transparency to children.
    look_for: In-product AI labels and explanations of limits, written for the age band.
    ideas: [I am an AI badge with a tap-to-learn explainer, Confidence hints on AI answers]
    improvement: Add an AI label with a short explanation of what the AI does and that it can make mistakes.
    refs: {AILIT: ["Engage 2", "Engage 3"]}
    sources: [AIA, AILIT, KIDS, UNICEF-AI, 5R-AICODE]
    terms: [[ai, artificial intelligence, chatbot, assistant, ia, inteligencia artificial, assistente], [disclos, label, labelled, labeled, tells, inform, can make mistakes, can be wrong, limitations, rotul, informa, pode errar, pode enganar, limitacoes]]

  - id: TRN-03
    axis: TRN
    title: Explain adaptivity and recommendations
    scope: feature
    features: [ai_adaptive, recommender]
    age_bands: [all]
    target: Children and teachers can see why the product chose a level, task or item, and can change it.
    why: The DSA and its Art. 28 guidelines ask for recommender transparency and choice; AILit Engage 4 teaches how recommendations shape perspectives.
    look_for: Why-am-I-seeing-this explanations and a way to choose differently.
    ideas: ["A why-this-level button", Learner choice to override the next task]
    improvement: Add a why-am-I-seeing-this explanation and a way to choose another path.
    refs: {AILIT: ["Engage 4"]}
    sources: [DSA, DSA-G28, AILIT]
    terms: [[recommend, adaptive, personalis, personaliz, next task, next level, recomend, adaptativ, personaliza, proxima tarefa, proximo nivel], [why, explain, because, choose, change, porque, explica, escolher, mudar]]

  - id: TRN-04
    axis: TRN
    title: Commercial content and purchases explained as a learning moment
    scope: feature
    features: [purchases]
    age_bands: [all]
    target: Every purchase, ad or sponsored item is clearly labelled with its real cost or commercial intent, in words the child understands.
    why: UCPD bans direct exhortation to children; the KIDS Act and DFA proposals require real-time purchase labels and ban disguised advertising.
    look_for: Price labels in real money, ad and sponsorship labels, explanations for children.
    ideas: [Coins-to-euros label on every price, This is an ad tag with a tap-to-learn note]
    improvement: Label prices in real money and mark commercial content, with a one-line explanation for children.
    refs: {DIGCOMP3: ["1.2"]}
    sources: [UCPD, KIDS, DFA]
    terms: [[price, purchase, cost, ad, ads, sponsored, advert, preco, compra, custo, anuncio, patrocinad, publicidade], [label, labelled, labeled, real money, euros, explain, rotul, dinheiro real, explica]]

  - id: TRN-05
    axis: TRN
    title: Provenance labels for generated or manipulated media
    scope: feature
    features: [ai_generative]
    age_bands: [all]
    target: AI-generated or altered images, audio and video are labelled, and children can learn what the label means.
    why: AI Act Art. 50 requires marking of synthetic content; AILit Create 4 addresses authenticity.
    look_for: Labels or watermarks on generated media and an explanation for learners.
    ideas: [Made with AI stamp that opens a short explainer, Provenance panel on shared creations]
    improvement: Label generated media and explain the label to learners.
    refs: {AILIT: ["Create 4"]}
    sources: [AIA, AILIT]
    terms: [[generated, synthetic, ai image, ai made, made with ai, gerad, sintetic, imagem de ia, feito com ia], [label, labelled, labeled, watermark, provenance, mark, rotul, marca de agua, proveniencia, marcad]]

  - id: TRN-06
    axis: TRN
    title: Safety tools explained where they are used
    scope: feature
    features: [chat, multiplayer, social, ugc]
    age_bands: [all]
    target: Block, report, mute and help options are explained to children in context, so using them is itself a lesson.
    why: The KIDS Act proposal (Art. 12) asks for contact safeguards and child-friendly reporting; DSA Art. 16 for notice mechanisms.
    look_for: Child-facing explanations next to report and block, practice flows, links to helplines.
    ideas: [First-time tooltip on the report button, Practice reporting in the tutorial]
    improvement: Explain report and block in the moment, and show what happens after a report.
    refs: {DIGCOMP3: ["4.1", "4.3"]}
    sources: [KIDS, DSA, BIK]
    terms: [[report, block, mute, help button, denunciar, reportar, bloquear, silenciar, botao de ajuda], [explain, explained, tutorial, tooltip, what happens, explica, explicad, o que acontece]]

  - id: TRN-07
    axis: TRN
    title: No hidden curriculum
    scope: universal
    age_bands: [all]
    target: The product does not model what literacy teaches against, such as AI that claims to be a friend or to know everything, pressure loops or disguised selling.
    why: Children learn from how products behave, not only from lessons. UNESCO and AILit warn about anthropomorphic AI; the KIDS Act and DFA proposals about manipulative design.
    look_for: Copy, dialogue and mechanics that contradict the learning goals (see the conflict phrases of every target).
    ideas: [Review all character dialogue against AI-02, Review reward loops against SAF-04]
    improvement: Remove or rewrite the copy and mechanics flagged as conflicts, and add a review step for new content.
    refs: {AILIT: ["Engage 2"]}
    sources: [UNESCO-AIAGE, AILIT, KIDS, DFA]
    terms: [[hidden curriculum, content review, copy review, dialogue review, curriculo oculto, revisao de conteudos, revisao de dialogos]]
    need: 1

  # ================================================================ EDU: educator and family enablement (design lens)
  - id: EDU-01
    axis: EDU
    title: Learning goals stated and mapped to a framework or curriculum
    scope: universal
    age_bands: [all]
    target: The product states what learners will know or be able to do, mapped to DigComp, AILit, the national curriculum or another named framework.
    why: Pedagogical fit and curriculum alignment is the first EU-DEC criterion; learning goals are the starting point of EAF and EdTech for Good reviews.
    look_for: A list of learning goals with framework references (for example DigComp 1.2, AILit Engage 3, Aprendizagens Essenciais).
    ideas: [Goal card per mission, Curriculum map for teachers]
    improvement: Write learning goals per activity and map each to a named framework and age band.
    refs: {DIGCOMP3: ["all"], AILIT: ["all"]}
    sources: [EU-DEC, ET4G2, DIGCOMP3, AILIT]
    terms: [[learning goal, learning goals, learning objective, learning objectives, learning outcome, learning outcomes, objetivo de aprendizagem, objetivos de aprendizagem, aprendizagens essenciais, competencias], [curriculum, framework, digcomp, ailit, aligned, mapped, curriculo, referencial, alinhad, mapead]]

  - id: EDU-02
    axis: EDU
    title: Teacher guidance for before, during and after use
    scope: universal
    age_bands: [all]
    target: Teachers get a guide with set-up, facilitation tips and debrief questions that link play to the literacy goals.
    why: The EU-DEC guidelines and EdTech for Good stress educator judgement and professionalism; in game-based learning the debrief is where learning is made explicit.
    look_for: Teacher guide, lesson plans, debrief or discussion questions.
    ideas: ["Three-step lesson card: frame, play, debrief", Printable discussion prompts]
    improvement: Add a teacher guide with a debrief for each literacy goal.
    refs: {}
    sources: [EU-DEC, ET4G2, ARNAB2014]
    terms: [[teacher guide, teachers guide, lesson plan, lesson plans, debrief, discussion questions, facilitat, guia do professor, plano de aula, planos de aula, debriefing, questoes para discussao, orientacoes para professores]]
    need: 1

  - id: EDU-03
    axis: EDU
    title: Evidence of learning beyond engagement
    scope: universal
    age_bands: [all]
    target: The product or its documentation shows how learning of the targets can be seen (formative checks, learner products, evaluation), not only time on task or points.
    why: Impact and assessment is an EU-DEC criterion; EdTech for Good asks for outcome measurement beyond engagement; the Dutch 3E framework grades evidence strength.
    look_for: Assessment aligned to goals, evaluation plans or results, without surveillance of learners.
    ideas: [Exit-ticket after each mission, Portfolio of learner decisions]
    improvement: Add a light formative check per goal and plan a small evaluation with a partner school.
    refs: {AILIT: ["learner expectations"]}
    sources: [EU-DEC, ET4G2, NL-3E]
