# Literacy claims in product or marketing documents. A claim on an axis with no target at Designed or
# above is reported as an unsupported claim (see UCPD on misleading claims, EU-DEC on reliability).
claims:
  verbs: [teaches, teach, develops, develop, builds, build, improves, improve, boosts, boost, strengthens, promotes, fosters, trains, ensina, desenvolve, promove, melhora, reforca, potencia, treina]
  topics:
    INF: [critical thinking, media literacy, information literacy, news literacy, fact checking, fake news, disinformation, pensamento critico, literacia mediatica, literacia da informacao, desinformacao, noticias falsas]
    COM: [digital citizenship, netiquette, online respect, empathy online, cidadania digital, etiqueta digital]
    CRE: [creativity, coding, programming, computational thinking, digital creativity, criatividade, programacao, pensamento computacional]
    SAF: [online safety, internet safety, cyber safety, cybersecurity, privacy, digital wellbeing, digital well being, seguranca online, seguranca na internet, ciberseguranca, privacidade, bem estar digital]
    PRB: [problem solving, problem-solving, learning to learn, resolucao de problemas, aprender a aprender]
    AI: [ai literacy, artificial intelligence literacy, understanding of ai, responsible use of ai, literacia em ia, literacia de ia, literacia em inteligencia artificial, uso responsavel da ia]
    ANY: [digital literacy, digital skills, digital competence, 21st century skills, future skills, literacia digital, competencias digitais]
  proof: [proven, evidence based, research based, scientifically, clinically, guaranteed, comprovad, baseado em evidencia, cientificamente, garantid]

targets:

  # ================================================================ INF: information and media
  - id: INF-01
    axis: INF
    title: Find and choose sources
    scope: claimed
    age_bands: [all]
    target: Learners search with a purpose, compare results and choose sources that fit the question.
    why: Searching and filtering is the first DigComp competence and the base of every other information skill.
    look_for: Tasks where learners search, filter or pick between sources and explain the choice.
    ideas: [A detective quest where clues come from sources of different quality, A search challenge with a budget of queries]
    improvement: Add tasks where learners must search, filter and pick a source, and say why it fits.
    refs: {DIGCOMP3: ["1.1"], UNESCO-MIL: ["locate and access information"]}
    sources: [DIGCOMP3, UNESCO-MIL]
    terms: [[search, searching, keyword, query, filter results, pesquisa, pesquisar, palavra chave, motor de busca], [source, sources, result, results, fonte, fontes, resultado, resultados]]

  - id: INF-02
    axis: INF
    title: Judge credibility by checking across sources
    scope: claimed
    age_bands: [all]
    target: Learners check who is behind information, compare it with other sources (lateral reading) and decide how far to trust it.
    why: UNESCO's MIL curriculum and its 2026 AI companion guide put source checking and informed trust at the centre.
    look_for: Activities that ask learners to verify a claim elsewhere, trace a source or rate credibility with reasons.
    ideas: [Two-tab challenge that rewards checking a claim on another site before answering, Trust meter with reasons instead of a right answer]
    improvement: Turn at least one task into a verification task with a debrief on why trust went up or down.
    refs: {DIGCOMP3: ["1.2"], UNESCO-MIL: ["critically evaluate information"], UNESCO-AIMIL: ["3.3"]}
    sources: [DIGCOMP3, UNESCO-MIL, UNESCO-AIMIL]
    terms: [[credib, reliab, trustworth, trust, verify, verification, check, checked, checking, fact check, cross check, lateral reading, credivel, fiavel, fiabilidade, confianca, verificar, verificacao, confirmar], [source, sources, claim, claims, information, second source, another source, fonte, fontes, afirmacao, informacao, segunda fonte, outra fonte]]

  - id: INF-03
    axis: INF
    title: Recognise persuasion, advertising and commercial intent
    scope: claimed
    features: [purchases]
    age_bands: [all]
    target: Learners recognise advertising, sponsorship and persuasive design, and can say who benefits.
    why: Children are a protected group under consumer law; recognising commercial intent is part of evaluating information.
    look_for: Activities about ads, influencers, sponsored content or persuasive design, with age-appropriate explanations.
    ideas: [Spot-the-ad level, Learners design an honest and a manipulative version of the same ad and compare]
    improvement: Add a short activity that unpacks one ad or persuasive pattern the learners meet in daily life.
    refs: {DIGCOMP3: ["1.2"], UNESCO-MIL: ["evaluate content of all content providers"]}
    sources: [DIGCOMP3, UNESCO-MIL, UCPD, KIDS]
    terms: [[advert, advertising, ad, ads, sponsor, influencer, persuasi, marketing, publicidade, anuncio, anuncios, patrocin, influenciador, persuas], [recognis, recogniz, spot, identify, understand, explain, reconhecer, identificar, perceber, explicar]]

  - id: INF-04
    axis: INF
    title: Spot mis- and disinformation, including synthetic media
    scope: claimed
    features: [ai_generative, ugc]
    age_bands: [all]
    target: Learners recognise false or manipulated content, including AI-generated images, audio and text, and know how to check provenance.
    why: DigComp 3.0 made mis- and disinformation a priority; AILit and UNESCO link it to AI-generated content.
    look_for: Tasks with manipulated or generated media, provenance checks, or correcting false claims.
    ideas: [Real-or-generated round with explanations of the tells and their limits, Trace-the-origin puzzle]
    improvement: Include generated or manipulated examples and teach a check (source, date, reverse search, provenance label).
    refs: {DIGCOMP3: ["1.2"], AILIT: ["Create 4"], UNESCO-AIMIL: ["2.5", "3.3"]}
    sources: [DIGCOMP3, AILIT, UNESCO-AIMIL, UNESCO-MIL]
    terms: [[misinformation, disinformation, fake news, false information, manipulated, deepfake, synthetic media, ai generated image, desinformacao, noticias falsas, informacao falsa, manipulad, gerado por ia, imagem gerada]]
    need: 1

  - id: INF-05
    axis: INF
    title: Organise, keep and cite information
    scope: claimed
    age_bands: [B3, B4, B5]
    target: Learners save, organise and reference what they found so others can check it.
    why: Managing information is a DigComp competence and supports honest use of sources.
    look_for: Features or tasks for collecting, organising and citing sources.
    ideas: [Evidence board where clues must carry their source, Citation as a game resource]
    improvement: Let learners keep and cite the sources they used, and reward correct attribution.
    refs: {DIGCOMP3: ["1.3"]}
    sources: [DIGCOMP3]
    terms: [[cite, citation, reference, bibliography, organise information, organize information, save sources, citar, citacao, referencia, bibliografia, organizar informacao]]
    need: 1

  # ================================================================ COM: communication, citizenship and rights
  - id: COM-01
    axis: COM
    title: Interact respectfully and with empathy
    scope: claimed
    features: [chat, multiplayer, social]
    age_bands: [all]
    target: Learners practise respectful, empathetic communication and understand how tone is read online.
    why: Digital behaviour and interaction are DigComp competences; empathy is a DQ (IEEE 3527.1) area.
    look_for: Scenarios about tone, misunderstandings, kindness or conflict online, with discussion.
    ideas: [Rewrite-the-message challenge, Perspective-switch scenes]
    improvement: Add scenarios where learners choose and discuss how to respond to others online.
    refs: {DIGCOMP3: ["2.1", "2.5"], IEEE3527: ["digital empathy"]}
    sources: [DIGCOMP3, IEEE3527]
    terms: [[respect, empathy, kindness, netiquette, tone, digital behaviour, digital behavior, respeito, empatia, gentileza, netiqueta, comportamento digital], [online, message, messages, comment, chat, mensagem, mensagens, comentario]]

  - id: COM-02
    axis: COM
    title: Collaborate through digital tools
    scope: claimed
    features: [multiplayer]
    age_bands: [all]
    target: Learners plan, share and build together using digital tools, with roles and shared reflection.
    why: Collaboration is a DigComp competence and a recurrent quality marker for game-based learning.
    look_for: Cooperative modes, shared goals, roles, and a debrief of how the group worked.
    ideas: [Cooperative puzzles that need every role, Team retrospectives after a mission]
    improvement: Add a cooperative task with roles and a short reflection on how the team worked.
    refs: {DIGCOMP3: ["2.4"]}
    sources: [DIGCOMP3]
    terms: [[collaborat, cooperat, teamwork, team work, group work, colabora, coopera, trabalho de equipa, trabalho em grupo]]
    need: 1

  - id: COM-03
    axis: COM
    title: Know and use digital rights; take part as citizens
    scope: claimed
    age_bands: [all]
    target: Learners know their rights online (privacy, expression, information, protection) and practise civic participation.
    why: UN General Comment 25 and the UNESCO MIL curriculum frame literacy as a matter of rights and participation.
    look_for: Content about children's rights online, freedom of expression, participation or complaints.
    ideas: [Rights cards earned by solving situations, Design a fair rule for an online community]
    improvement: Add content that names children's rights online and how to use them.
    refs: {DIGCOMP3: ["2.3"], UNESCO-MIL: ["human rights and dignity"]}
    sources: [DIGCOMP3, UNCRC-GC25, UNESCO-MIL]
    terms: [[children's rights, childrens rights, digital rights, rights online, citizenship, civic participation, freedom of expression, direitos das criancas, direitos digitais, direitos online, cidadania, participacao civica, liberdade de expressao]]
    need: 1

  - id: COM-04
    axis: COM
    title: Respond to hate, harassment and harmful content
    scope: claimed
    features: [chat, ugc, social]
    age_bands: [all]
    target: Learners recognise hate speech, harassment and harmful content, and know how to respond, report and support others.
    why: The UNESCO MIL curriculum names responding to hate content online as a core competence; BIK+ supports it.
    look_for: Scenarios on cyberbullying or hate speech with bystander options and where to get help.
    ideas: [Upstander choices with consequences, Report-and-support walkthrough]
    improvement: Add a scenario on responding to harassment, including reporting and supporting a peer.
    refs: {DIGCOMP3: ["2.5"], UNESCO-MIL: ["respond to hate and radical content online"]}
    sources: [DIGCOMP3, UNESCO-MIL, BIK]
    terms: [[cyberbullying, bullying, harassment, hate speech, hate, harmful content, ciberbullying, assedio, discurso de odio, odio, conteudo nocivo]]
    need: 1

  - id: COM-05
    axis: COM
    title: Manage digital identity and footprint
    scope: claimed
    features: [accounts, ugc, social]
    age_bands: [all]
    target: Learners understand what they leave behind online, how identity is presented and how to manage it.
    why: Managing digital identity is a DigComp competence; footprint management is a DQ competence.
    look_for: Activities on profiles, avatars, permanence of posts and what others can see.
    ideas: [Footprint trail mechanic that shows what stays, Avatar choices with privacy trade-offs explained]
    improvement: Show learners what their actions leave behind and let them practise managing it.
    refs: {DIGCOMP3: ["2.6"], IEEE3527: ["digital footprint management"]}
    sources: [DIGCOMP3, IEEE3527]
    terms: [[digital footprint, digital identity, online identity, reputation, pegada digital, identidade digital, identidade online, reputacao]]
    need: 1

  # ================================================================ CRE: creation and computational thinking
  - id: CRE-01
    axis: CRE
    title: Create and express with digital media
    scope: claimed
    features: [ugc]
    age_bands: [all]
    target: Learners make their own digital content (text, images, sound, video, games) for a purpose and an audience.
    why: Developing digital content is a DigComp competence; creating is also how learners understand media from the inside.
    look_for: Creation tools, open tasks and sharing with a defined audience.
    ideas: [Level editor, Make-a-news-story mode]
    improvement: Add an open creation task with a purpose, an audience and feedback.
    refs: {DIGCOMP3: ["3.1"]}
    sources: [DIGCOMP3]
    terms: [[create, creation, make their own, design their own, produce, criar, criacao, produzir], [content, story, stories, video, image, images, music, comic, level editor, conteudo, historia, imagem, musica, banda desenhada, editor de niveis]]

  - id: CRE-02
    axis: CRE
    title: Remix responsibly and give credit
    scope: claimed
    features: [ugc, ai_generative]
    age_bands: [all]
    target: Learners reuse and remix content legally and fairly, understand licences and credit authors, including when AI is involved.
    why: Copyright and licences are a DigComp competence; AILit adds authenticity and intellectual property of AI content.
    look_for: Content on licences (for example Creative Commons), attribution, and honest disclosure of AI help.
    ideas: [Credits screen learners must fill in, Licence badges on reusable assets]
    improvement: Teach and require attribution when learners reuse assets or AI output.
    refs: {DIGCOMP3: ["3.2", "3.3"], AILIT: ["Create 4"]}
    sources: [DIGCOMP3, AILIT]
    terms: [[copyright, licence, license, creative commons, attribution, give credit, plagiar, direitos de autor, licenca, atribuicao, plagio, creditos]]
    need: 1

  - id: CRE-03
    axis: CRE
    title: Computational thinking and programming
    scope: claimed
    age_bands: [all]
    target: Learners decompose problems, recognise patterns, build algorithms and debug, with or without code.
    why: Computational thinking and programming is a DigComp competence and a foundation for shaping AI.
    look_for: Coding, block programming, algorithm puzzles or unplugged activities with debugging.
    ideas: [Program-the-robot puzzles, Debug-the-broken-level challenge]
    improvement: Add tasks where learners build and debug a sequence of instructions.
    refs: {DIGCOMP3: ["3.4"], AILIT: ["Manage 3"]}
    sources: [DIGCOMP3, AILIT]
    terms: [[computational thinking, coding, programming, algorithm, debug, decompos, pensamento computacional, programacao, programar, algoritmo, depurar]]
    need: 1

  # ================================================================ SAF: safety, privacy and wellbeing
  - id: SAF-01
    axis: SAF
    title: Protect devices and accounts; recognise scams
    scope: claimed
    features: [accounts]
    age_bands: [all]
    target: Learners use strong passwords or passphrases, recognise phishing and scams, and know what to do when something looks wrong.
    why: Protecting devices is a DigComp competence; DigComp 3.0 prioritised cybersecurity competence.
    look_for: Activities on passwords, phishing, scams or suspicious links.
    ideas: [Phishing inbox sorting game, Build-a-passphrase challenge]
    improvement: Add a short, age-appropriate activity on scams or account protection.
    refs: {DIGCOMP3: ["4.1"], IEEE3527: ["personal cyber security management"]}
    sources: [DIGCOMP3, IEEE3527]
    terms: [[password, passphrase, phishing, scam, scams, malware, suspicious link, cybersecurity, palavra passe, senha, burla, burlas, phishing, ligacao suspeita, ciberseguranca]]
    need: 1

  - id: SAF-02
    axis: SAF
    title: Understand personal data and privacy choices
    scope: claimed
    features: [accounts, ai_adaptive, recommender]
    age_bands: [all]
    target: Learners understand what personal data is, who can see it, how products use it, and how to make privacy choices.
    why: Protecting personal data and privacy is a DigComp competence and a right under the GDPR.
    look_for: Activities on personal data, permissions, privacy settings, or what the product itself collects.
    ideas: [Data trail visualiser of the learner's own session, Permission puzzles]
    improvement: Use the product's own data use as a teaching example, in age-appropriate language.
    refs: {DIGCOMP3: ["4.2"], IEEE3527: ["privacy management"], UNESCO-AIMIL: ["1.2"]}
    sources: [DIGCOMP3, GDPR, IEEE3527]
    terms: [[personal data, privacy, data protection, permissions, who can see, dados pessoais, privacidade, protecao de dados, permissoes, quem pode ver]]
    need: 1

  - id: SAF-03
    axis: SAF
    title: Handle contact risks and seek help
    scope: claimed
    features: [chat, multiplayer, social, ugc]
    age_bands: [all]
    target: Learners know what to do if someone online makes them uncomfortable, including blocking, reporting and telling a trusted adult or helpline.
    why: Contact risks are central to the EU KIDS Act proposal and BIK+; help-seeking is the protective skill.
    look_for: Age-appropriate scenarios on contact from strangers or pressure, and named routes to help.
    ideas: [Trusted-adult map, Practice report flow in a safe sandbox]
    improvement: Teach the block, report and tell routes, and name a helpline for the learner's country.
    refs: {DIGCOMP3: ["4.1", "4.3"]}
    sources: [DIGCOMP3, BIK, KIDS]
    terms: [[stranger, strangers, uncomfortable, trusted adult, helpline, block and report, report and block, ask for help, desconhecido, desconhecidos, desconfortavel, adulto de confianca, linha de apoio, pedir ajuda]]
    need: 1

  - id: SAF-04
    axis: SAF
    title: Balance use and self-regulate
    scope: claimed
    features: [streaks, notifications, leaderboards]
    age_bands: [all]
    target: Learners notice how digital products capture attention, reflect on their own use and practise taking breaks.
    why: Supporting wellbeing is a DigComp competence; the Education Package launches a European Healthy Screens Pledge.
    look_for: Activities on attention design, screen time reflection, or built-in stopping points discussed with learners.
    ideas: [Natural end points with a reflection prompt, Attention-trap spotting activity]
    improvement: Add a reflection on attention design, using the product's own stopping points as the example.
    refs: {DIGCOMP3: ["4.3"]}
    sources: [DIGCOMP3, EU-EDUPKG, KIDS]
    terms: [[wellbeing, well being, screen time, take a break, breaks, self regulation, attention design, bem estar, tempo de ecra, fazer uma pausa, pausas, autorregulacao]]
    need: 1
    conflict: ["don't break your streak", "do not lose your streak", "come back every day", "play every day or", "nao percas a tua sequencia", "volta todos os dias"]

  - id: SAF-05
    axis: SAF
    title: Understand money, purchases and chance in digital products
    scope: claimed
    features: [purchases]
    age_bands: [all]
    target: Learners understand virtual currencies, real costs, in-app purchases and chance-based rewards, and can resist pressure to spend.
    why: The EU KIDS Act and Digital Fairness Act proposals target spending traps and loot boxes; understanding them is consumer literacy.
    look_for: Explanations of virtual currency value, odds and spending pressure, in learner language.
    ideas: [Price-tag converter from coins to euros, Odds explainer before any chance mechanic]
    improvement: Explain virtual currencies and chance in plain language and show real costs.
    refs: {DIGCOMP3: ["2.5", "4.3"]}
    sources: [DIGCOMP3, KIDS, DFA, UCPD]
    terms: [[virtual currency, in app purchase, in game purchase, loot box, real money, drop rate, odds of winning, moeda virtual, compras na aplicacao, dinheiro real, probabilidade de ganhar, caixa surpresa]]
    need: 1
    conflict: ["loot box", "mystery box", "spin the wheel", "caixa mistério", "roda da sorte"]

  - id: SAF-06
    axis: SAF
    title: Consider the environmental footprint of digital tech and AI
    scope: claimed
    features: [ai_generative]
    age_bands: [all]
    target: Learners know that devices, data centres and AI use energy and resources, and weigh that in their choices.
    why: Protecting the environment is a DigComp competence; AILit includes comparing how AI systems consume energy and resources.
    look_for: Content on energy, resources, e-waste or the footprint of AI use.
    ideas: [Energy cost shown for each AI request in a simulation, Repair-not-replace mission]
    improvement: Add a short activity on the energy and resource cost of the technology learners use.
    refs: {DIGCOMP3: ["4.4"], AILIT: ["Engage 5"], UNESCO-AIMIL: ["4.5"]}
    sources: [DIGCOMP3, AILIT]
    terms: [[energy use, energy consumption, carbon, e waste, environmental impact, data centre, data center, consumo de energia, carbono, residuos eletronicos, impacto ambiental, centro de dados]]
    need: 1

  # ================================================================ PRB: problem solving and learning to learn
  - id: PRB-01
    axis: PRB
    title: Solve technical problems
    scope: claimed
    age_bands: [all]
    target: Learners identify and solve simple technical problems and know where to find help.
    why: Identifying and solving technical problems is a DigComp competence.
    look_for: Troubleshooting tasks, hints that teach strategies rather than give answers.
    ideas: [Fix-the-machine puzzles, Hint ladder that teaches a troubleshooting method]
