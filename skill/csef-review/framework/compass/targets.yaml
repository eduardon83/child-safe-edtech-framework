  # ================================================================ AI: AI literacy (AILit)
  - id: AI-01
    axis: AI
    title: Recognise AI and its influence
    scope: claimed
    features: [ai_generative, ai_adaptive, ai_assessment, recommender]
    age_bands: [all]
    target: Learners recognise when AI is involved and how it shapes what they see, choose and are offered.
    why: AILit Engage 1 and 4; UNESCO's human-centred mindset. Recognising AI comes before judging it.
    look_for: Activities that make AI visible (where is the AI here?) including in the product itself.
    ideas: [Where-is-the-AI hunt across everyday apps, Show what the game's own adaptive engine decided and why]
    improvement: Make AI visible in the experience and ask learners where it shapes what they see.
    refs: {AILIT: ["Engage 1", "Engage 4"], UNESCO-AICFS: ["human-centred mindset"]}
    sources: [AILIT, UNESCO-AICFS]
    terms: [[artificial intelligence, ai, algorithm, recommendation, recommender, inteligencia artificial, ia, algoritmo, recomendacao], [recognis, recogniz, identify, spot, notice, influence, shape, reconhecer, identificar, influencia]]

  - id: AI-02
    axis: AI
    title: Explain how AI works, without anthropomorphism
    scope: claimed
    features: [ai_generative]
    age_bands: [all]
    target: Learners describe what AI systems do (predict, classify, generate) in accurate language, and that they do not think or feel.
    why: AILit Engage 2 asks for language that clears up misconceptions; UNESCO warns children treat fluent AI as having a mind.
    look_for: Explanations of data, patterns and prediction; AI characters that say clearly what they are.
    ideas: [Train-a-tiny-model unplugged activity, AI character that explains it predicts words]
    improvement: Explain how the AI works in plain words and avoid presenting it as a friend or a person.
    refs: {AILIT: ["Engage 2"], UNESCO-AIMIL: ["1.1", "3.1"], UNESCO-AICFS: ["AI techniques and applications"]}
    sources: [AILIT, UNESCO-AIMIL, UNESCO-AIAGE]
    terms: [[how ai works, training data, predicts, prediction, pattern, patterns, machine learning, large language model, como funciona a ia, dados de treino, previsao, padroes, aprendizagem automatica]]
    need: 1
    conflict: ["ai friend", "your best friend", "i am your friend", "i'm your friend", "knows everything", "always right", "never wrong", "never makes mistakes", "o teu melhor amigo", "sou teu amigo", "sabe tudo", "nunca se engana", "tem sempre razao"]

  - id: AI-03
    axis: AI
    title: "Evaluate AI outputs: accept, revise or reject"
    scope: claimed
    features: [ai_generative]
    age_bands: [all]
    target: Learners check AI outputs against trusted sources and task needs, and decide to accept, revise or reject them.
    why: AILit Engage 3; UNESCO's three source questions for AI answers (what shaped it, what is missing, who is accountable).
    look_for: Tasks where AI output can be wrong and learners must verify and decide.
    ideas: [Planted AI mistakes to find, Accept-revise-reject buttons with a reason]
    improvement: Build in AI answers that need checking, and make learners decide with a reason.
    refs: {AILIT: ["Engage 3"], UNESCO-AIMIL: ["2.5", "3.3"]}
    sources: [AILIT, UNESCO-AIMIL]
    terms: [[ai output, ai answer, ai generated, chatbot answer, generated answer, resposta da ia, gerado por ia, resposta do chatbot], [check, verify, evaluate, accept, revise, reject, wrong, mistake, verificar, avaliar, aceitar, rever, rejeitar, errad, erro]]

  - id: AI-04
    axis: AI
    title: Recognise bias and fairness issues
    scope: claimed
    age_bands: [all]
    target: Learners explain how data and design choices can make AI unfair, and how to notice it.
    why: AILit Engage 6; UNESCO highlights cultural and linguistic exclusion by AI.
    look_for: Activities where learners compare outputs for different groups or examine training data.
    ideas: [Biased-dataset sorting game, Compare outputs for different names or languages]
    improvement: Add one activity where learners find and discuss a biased result.
    refs: {AILIT: ["Engage 6"], UNESCO-AICFS: ["ethics of AI"]}
    sources: [AILIT, UNESCO-AICFS, UNESCO-AIAGE]
    terms: [[bias, biased, fairness, unfair, discriminat, stereotype, enviesad, vies, justica, injust, discrimina, estereotipo]]
    need: 1

  - id: AI-05
    axis: AI
    title: Weigh ethics, values and resources of AI use
    scope: claimed
    age_bands: [all]
    target: Learners judge whether a use of AI fits human values and rights, including privacy, accountability and environmental cost.
    why: AILit Engage 5 and 7; UNESCO's ethics of AI dimension. Ethics is part of literacy, not a separate topic.
    look_for: Dilemmas, debates or role plays about AI use and who is accountable.
    ideas: [Who-answers-for-the-algorithm role play, Should-we-use-AI-here debate cards]
    improvement: Add a dilemma where learners argue whether and how AI should be used.
    refs: {AILIT: ["Engage 5", "Engage 7"], UNESCO-AICFS: ["ethics of AI"], UNESCO-AIMIL: ["4.4"]}
    sources: [AILIT, UNESCO-AICFS, UNESCO-AIMIL]
    terms: [[ai ethics, ethics of ai, ethical, accountab, responsible ai, human values, etica da ia, etic, responsabiliza, ia responsavel, valores humanos]]
    need: 1

  - id: AI-06
    axis: AI
    title: Create with AI while keeping one's own voice
    scope: claimed
    features: [ai_generative]
    age_bands: [B4, B5]
    target: Learners use AI to explore ideas, get feedback and refine their work, while the work stays theirs and AI help is disclosed.
    why: AILit Create 1 to 3 keep the learner's own creative vision first. UNESCO recalls a minimum age of 13 for independent use of generative AI in class.
    look_for: Tasks where AI gives feedback or alternatives and learners decide, with disclosure of AI use.
    ideas: ["AI as critic, not author", Version history showing learner and AI contributions]
    improvement: Make AI a feedback partner, keep the learner as author, and show what AI contributed.
    refs: {AILIT: ["Create 1", "Create 2", "Create 3"]}
    sources: [AILIT, UNESCO-AIMIL]
    terms: [[generative ai, prompt, prompting, ai feedback, refine, iterate, ia generativa, comando, feedback da ia, melhorar, iterar]]
    need: 1
    conflict: ["the ai will write it for you", "ai does your homework", "no need to think", "a ia faz os trabalhos de casa", "a ia escreve por ti"]

  - id: AI-07
    axis: AI
    title: Decide when and how to use AI, and monitor its use
    scope: claimed
    features: [ai_generative]
    age_bands: [all]
    target: Learners decide whether a task should be done with AI, split tasks between human and AI, and review the result.
    why: AILit Manage 1 to 4; delegation and oversight are central to agency.
    look_for: Explicit choices about using AI, task decomposition, and review of AI contribution.
    ideas: [Human-or-AI task sorter, Oversight checkpoint after each AI step]
    improvement: Add a decision point and a review step for every AI-assisted task.
    refs: {AILIT: ["Manage 1", "Manage 3", "Manage 4"]}
    sources: [AILIT]
    terms: [[when to use ai, whether to use ai, decide to use ai, human oversight, monitor ai, quando usar a ia, decidir usar a ia, supervisao humana]]
    need: 1

  - id: AI-08
    axis: AI
    title: Investigate and shape AI systems
    scope: claimed
    age_bands: [all]
    target: Learners investigate how an AI system is meant to work, test it with criteria and propose improvements for human wellbeing.
    why: AILit Shape 1 to 4 and UNESCO's AI system design dimension. Learners can shape technology, not only be shaped by it.
    look_for: Tasks where learners test, train or redesign a simple AI system, even unplugged.
    ideas: [Train-and-test a classifier in a sandbox, Redesign a recommender for fairness]
    improvement: Add a task where learners test an AI system with their own cases and propose a change.
    refs: {AILIT: ["Shape 1", "Shape 2", "Shape 3", "Shape 4"], UNESCO-AICFS: ["AI system design"]}
    sources: [AILIT, UNESCO-AICFS]
