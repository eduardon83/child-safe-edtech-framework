# CSEF source pack: Portugal
# Loaded automatically when a product manifest lists `jurisdictions: [PT]`.
# Maintainer note: every entry has a `verified` date. Re-check before relying on it.

pack:
  id: pt
  title: Portugal national pack
  jurisdiction: PT
  version: "0.1.0"
  maintainer: "CSEF maintainers"
  status: "Draft. Entries marked 'verify' need confirmation by a Portuguese legal reviewer."

parameters:
  digital_consent_age: 13
  supervisory_authority: "CNPD, Comissão Nacional de Proteção de Dados"
  digital_services_coordinator: "ANACOM"
  child_helpline: "Linha Internet Segura 800 21 90 90"

sources:
  - id: PT-LEI58
    title: "Lei n.º 58/2019, execução do RGPD na ordem jurídica nacional"
    type: law
    jurisdiction: PT
    status: "In force since 9 Aug 2019. Art. 16: age of digital consent is 13"
    url: "https://diariodarepublica.pt/dr/detalhe/lei/58-2019-123815982"
    verified: 2026-11-11

  - id: PT-DL83
    title: "Decreto-Lei n.º 83/2018, acessibilidade dos sítios web e aplicações móveis de organismos públicos"
    type: law
    jurisdiction: PT
    status: "In force. Applies to public bodies, including public schools, and their apps"
    url: "https://diariodarepublica.pt/dr/detalhe/decreto-lei/83-2018-116734769"
    verified: 2026-11-11

  - id: PT-CNPD
    title: "CNPD, guidance and list of processing operations requiring a DPIA"
    type: guidance
    jurisdiction: PT
    status: "Check the current list on the CNPD website (verify)"
    url: "https://www.cnpd.pt"
    verified: 2026-11-11

  - id: PT-ANACOM
    title: "ANACOM, Portuguese Digital Services Coordinator under the DSA"
    type: guidance
    jurisdiction: PT
    status: "Designated Digital Services Coordinator"
    url: "https://www.anacom.pt"
    verified: 2026-11-11

  - id: PT-ISEGURA
    title: "Internet Segura (Portuguese Safer Internet Centre) and Linha Internet Segura"
    type: guidance
    jurisdiction: PT
    status: "Operating. Helpline for children, guardians and educators"
    url: "https://www.internetsegura.pt"
    verified: 2026-11-11

  - id: PT-EPM
    title: "Referencial de Educação para os Media para a Educação Pré-escolar, o Ensino Básico e o Ensino Secundário (DGE), versão revista e atualizada"
    type: guidance
    jurisdiction: PT
    status: "First approved 29 Apr 2014; revised and updated version of Dec 2023 (verify the current edition)"
    url: "https://cidadania.dge.mec.pt/sites/default/files/pdfs/referencial-epm-versaoatualizada-12dez2023.pdf"
    verified: 2026-11-14

  - id: PT-MIME
    title: "Despacho n.º 15847/2007, de 19 de junho (DR 2.ª série, n.º 140, 23 jul 2007): inquéritos em meio escolar; sistema MIME (Monitorização de Inquéritos em Meio Escolar), apreciação pela DGE"
    type: law
    jurisdiction: PT
    status: "In force. Questionnaires and surveys in public schools need prior authorisation (now DGE, through MIME); DGE says when guardian authorisation is needed. Sensitive questions may need a prior CNPD opinion"
    url: "https://www.dge.mec.pt/sites/default/files/DSPE/mime/despacho_n_15_846_de_2007.pdf"
    verified: 2026-11-14

  - id: PT-LPCJP
    title: "Lei de Proteção de Crianças e Jovens em Perigo, Lei n.º 147/99, de 1 de setembro (versão atual)"
    type: law
    jurisdiction: PT
    status: "In force, as amended (latest by Lei 26/2018). Schools are entities with competence in childhood matters; danger situations are reported to the CPCJ"
    url: "https://diariodarepublica.pt/dr/detalhe/lei/147-1999-581619"
    verified: 2026-11-14

amend:
  - rule: AGE-B4-01
    add_sources: [PT-LEI58]
    note: "Portugal: age of digital consent is 13 (Lei 58/2019, art. 16). Below 13, consent-based processing needs guardian authorisation."

  - rule: CORE-DAT-11
    add_sources: [PT-LEI58]
    note: "Portugal: guardian consent is needed below 13 where consent is the legal basis."

  - rule: CORE-DAT-01
    add_sources: [PT-CNPD]
    note: "Portugal: check the CNPD list of operations that always require a DPIA. In public school deployments the school or Ministry is usually the controller."

  - rule: CORE-ACC-01
    add_sources: [PT-DL83]
    tier: 1
    note: "Portugal: products delivered to public schools or other public bodies must meet DL 83/2018, including an accessibility statement."

  - rule: CORE-SAF-06
    add_sources: [PT-ISEGURA]
    note: "Portugal: show Linha Internet Segura (800 21 90 90) in help and support screens."

  - rule: CORE-SEC-05
    add_sources: [PT-CNPD]
    note: "Portugal: personal data breaches are notified to the CNPD by the controller within 72 hours."

  - rule: CORE-DAT-15
    add_sources: [PT-CNPD, PT-MIME]
    note: "Portugal: questionnaires with sensitive questions applied in public schools may need a prior CNPD opinion within the DGE (MIME) procedure."

  - rule: CORE-SAF-11
    add_sources: [PT-LPCJP, PT-ISEGURA]
    note: "Portugal: the school, as an entity with competence in childhood matters, acts on danger situations and reports them to the CPCJ (Lei 147/99). Show Linha Internet Segura (800 21 90 90) and SOS Criança (116 111) next to open questions."

  - rule: B-DAT-01
    add_sources: [PT-MIME]
    note: "Portugal: research or evaluation questionnaires in public schools need prior DGE authorisation through MIME (Despacho 15847/2007)."

  - rule: CORE-COM-03
    add_patterns:
      - {type: regex, confidence: medium, flags: i, pattern: '(apenas hoje|só hoje|tempo limitado|esgota já|não fiques de fora)'}

rules:
  - id: PT-LNG-01
    title: Child-facing information in European Portuguese
    level: MUST
    tier: 3
    profiles: [core]
    age_bands: [all]
    requirement: >
      Everything a child in Portugal reads or hears (instructions, settings, warnings, privacy
      notice, reporting tools) is available in European Portuguese, written for the target age.
    rationale: >
      KIDS Act Art. 18 and 19 require information minors can understand. For VLOPs it requires
      the official language of the Member State; for everyone else it is best practice.
    improvement: Add PT-PT copy for all child-facing text and have it reviewed by an instructional designer.
    effort: medium
    sources: [KIDS]
    detection:
      method: manual

  - id: PT-SUP-01
    title: Help screens point to Portuguese support services
    level: SHOULD
    tier: 2
    profiles: [core]
    age_bands: [all]
    features: [multiplayer, chat, ugc, social, ai_generative]
    requirement: >
      Support information after a report includes Portuguese resources (Linha Internet Segura)
      and explains in simple words how to get help from a trusted adult.
    rationale: KIDS Act Art. 19(4) requires informing minors of national support organisations.
    improvement: Add the Linha Internet Segura number and link to the help screen.
    effort: low
    sources: [KIDS, PT-ISEGURA]
    detection:
      method: manual

  - id: PT-SUR-01
    title: Questionnaires to pupils in public schools go through DGE approval (MIME)
    level: MUST
    tier: 1
    profiles: [core]
    age_bands: [all]
    features: [survey]
    requirement: >
      Questionnaires or surveys applied to pupils in Portuguese public schools for evaluation,
      research or product studies, on paper or inside the product, are submitted to the DGE through
      MIME (Monitorização de Inquéritos em Meio Escolar) before use, unless they are registered in the
      national statistical system. The school also authorises, and guardian authorisation is obtained
      where the DGE requires it. Questions that are part of the learning activity itself are agreed
      with the school and kept in the survey register.
    rationale: >
      Despacho 15847/2007 requires prior authorisation for questionnaires and surveys in public
      schools, proposed by internal or external entities, and lets the DGE decide when guardian
      authorisation is needed. Questionnaires with sensitive questions have been withdrawn from schools
      for lacking it.
    improvement: Register evaluation and research questionnaires in MIME, keep the approval number in `survey.research_approval`, and plan the timeline around it.
    effort: medium
    sources: [PT-MIME]
    detection:
      method: manifest
      patterns:
        - {type: manifest, check: survey_research_without_approval, confidence: medium}

# Literacy Compass (tooling/compass.py): Portuguese references for the literacy targets.
compass:
  amend:
    - target: INF-02
      add_sources: [PT-EPM]
      note: "In Portugal, map media and information targets to the Referencial de Educação para os Media (DGE)."
    - target: INF-03
      add_sources: [PT-EPM]
    - target: INF-04
      add_sources: [PT-EPM]
    - target: COM-03
      add_sources: [PT-EPM]
    - target: SAF-03
      add_sources: [PT-ISEGURA]
      note: "Name Linha Internet Segura (800 21 90 90) as the helpline for learners in Portugal."
    - target: EDU-03
      add_sources: [PT-MIME]
      note: "Portugal: evaluation questionnaires to pupils in public schools need DGE approval through MIME before a pilot (rule PT-SUR-01)."
    - target: EDU-01
      add_sources: [PT-EPM]
      add_terms: [[referencial de educacao para os media, educacao para os media, perfil dos alunos]]
      note: "Map learning goals to the Aprendizagens Essenciais and, for media literacy, to the Referencial de Educação para os Media."
