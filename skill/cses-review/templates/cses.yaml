# CSES product manifest. Copy to the root of your product repository as cses.yaml.
# It tells the scanner and reviewers what the product is, who uses it and how.
# Keep it honest: undeclared features found in code are reported as such.

cses_version: "0.1"
product: "Product name"
description: "One sentence on what the product does and for whom."

# A = educational game, B = game-based application or software, C = gamified application.
# A product can declare more than one (see standard/00-introduction.md, section 3).
profiles: [A]

# B1 3-5, B2 6-9, B3 10-12, B4 13-15, B5 16-17. List every band that uses the product.
age_bands: [B2, B3]

# 1 = Legal baseline: binding law only.
# 2 = Forward-compliant: plus adopted proposals and official benchmarks (EU KIDS Act, DFA, DSA guidelines).
# 3 = Best practice: plus research and expert recommendations.
compliance_level: 2

# Loads packs/<code>.yaml for each country (EU is the base and needs no pack).
jurisdictions: [EU, PT]

# Extra packs: national guidance, procurement rules, literature, your own company red lines.
packs: []
#  - .cses/packs/my-company.yaml

context: school               # school | home | mixed
distribution:
  - channel: school           # school | app_store | web | platform
    operated_by: school       # school (or on its behalf) | provider

legal_scope:
  # exempt_educational | in_scope_online_game | in_scope_ai_companion | in_scope_platform | not_applicable | unknown
  kids_act: exempt_educational
  dsa_online_platform: false

gdpr_role: processor          # controller | processor | joint

# Declare every feature present. Rules that depend on a feature only appear when it is declared.
# accounts, multiplayer, chat, ugc, social, notifications, streaks, leaderboards, purchases,
# assessment, ai_generative, ai_assessment, ai_adaptive, recommender
features: [accounts]

ai:
  inventory: null             # e.g. docs/ai-inventory.md (required if any ai_* feature)
  act_class: none             # none | limited_risk_art50 | high_risk_annex_iii
  risk_file: null             # e.g. docs/ai-risk-file.md (required for ai_assessment / ai_adaptive)

monetisation: none            # none | adult_licence | subscription_adult | in_app_purchases | ads | virtual_currency

third_parties:
  - name: "Hosting provider"
    purpose: "hosting and database"
    region: "eu-central-1"
    dpa_signed: true
    # transfer_mechanism: "SCCs + TIA"   # required if region is outside the EEA

retention:
  - category: "gameplay events"
    period: "end of school year + 30 days"
    enforced_by: "jobs/purge-gameplay.ts"

dpia: docs/dpia.md
security_policy: SECURITY.md

# Accepted gaps. A waiver needs a reason, a named approver and an expiry date.
waivers: []
#  - rule: CORE-SEC-03
#    path: "src/legacy/*"
#    reason: "Legacy CDN only serves public images over http; migration ticket #123"
#    approved_by: "DPO, Jane Doe"
#    expires: 2027-03-31

last_review: 2026-11-11
