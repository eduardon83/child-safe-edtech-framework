# Topic map for comparing codes of conduct with CSES (used by tooling/coc.py).
#
# For each rule:
#   terms     groups of synonyms. A clause "covers" the rule when it matches at least two groups
#             (or the only group) with committing language (must, shall, will, never, do not...).
#   conflict  subject terms. A sentence that mentions one of them with permissive language
#             (may, can, allowed, permitted, optional, provided that...) and no negation is flagged
#             as a possible conflict for a person to review.
#   conflict_regex  extra patterns that signal a conflict on their own (e.g. "enabled by default").
#   skip      engineering-internal rules a code of conduct is not expected to cover.
# Matching is case-insensitive, ignores accents and hyphens, and is in English. For codes in other
# languages, translate first or use the cses-review skill, which compares meaning, not words.
#
# Licence: CC BY 4.0

structure:
  - id: COC-S01
    title: Clear, specific objectives
    basis: "KIDS Act Art. 17(2)(a), Art. 23(2)"
    terms: [[objective, aim, purpose, goal], [protect, minors, children, young people, safety]]
  - id: COC-S02
    title: Specific, verifiable commitments
    basis: "KIDS Act Art. 23(2)"
    terms: [[commit, signatories shall, members shall, members must, members will, signatories must, signatories will, undertake]]
    need: 1
  - id: COC-S03
    title: Criteria for violent, sexual, gambling and self-harm content
    basis: "KIDS Act Art. 17(2)(b), Recital 39"
    terms: [[violen], [sexual, nudity], [gambling, simulated gambling], [self harm, selfharm, suicide]]
    need: 4
  - id: COC-S04
    title: Criteria for in-app purchases, contact risks and addictive design
    basis: "KIDS Act Art. 17(2)(b)"
    terms: [[in app purchase, in game purchase, microtransaction, purchases, monetisation, monetization], [contact, interaction, communication, chat], [addictive, compulsive, excessive use, engagement design]]
    need: 3
  - id: COC-S05
    title: Free, independent remedies and redress
    basis: "KIDS Act Art. 17(2)(c)"
    terms: [[redress, remedy, remedies, appeal, dispute, complaint], [independent, impartial], [free of charge, no cost, without charge]]
    need: 2
  - id: COC-S06
    title: Recognisable age labels and descriptors shown before access or purchase
    basis: "KIDS Act Art. 17(2)(d)"
    terms: [[age label, age rating, rating label, age classification], [descriptor, content descriptor, icon], [before, prior to, prominently]]
    need: 2
  - id: COC-S07
    title: Regular, transparent, independent monitoring with KPIs and updates
    basis: "KIDS Act Art. 17(2)(e), Art. 23(2), Recital 39"
    terms: [[monitor, audit, evaluation, evaluate], [independent, third party, external], [key performance indicator, kpi, indicator, metric], [update, review, revise]]
    need: 3
  - id: COC-S08
    title: Regular reporting to authorities
    basis: "KIDS Act Art. 23(2)"
    terms: [[report, reporting], [commission, authority, authorities, regulator, coordinator]]
  - id: COC-S09
    title: Involvement of minors, guardians, educators and civil society
    basis: "KIDS Act Art. 17(1), Art. 23(1)"
    terms: [[consult, involve, participation, co design, codesign, engage], [children, minors, young people, parents, guardians, educators, teachers, civil society]]
  - id: COC-S10
    title: Measures for online games (Art. 15), incl. interactive features and monetisation
    basis: "KIDS Act Art. 17(2)(f)"
    terms: [[online game, video game, games], [interactive, multiplayer, online features, interaction], [monetisation, monetization, purchases, loot box]]
    need: 2
  - id: COC-S11
    title: States that adherence does not by itself mean legal compliance
    basis: "KIDS Act Recital 39"
    terms: [[compliance, comply, applicable law, legal obligations], [does not, without prejudice, in addition to, not replace]]

