name: "CSEF child-safety check"
description: "Pre-compliance scan against the Child-Safe EdTech Framework: report, improvement plan and SARIF."
branding:
  icon: shield
  color: green
inputs:
  repo:
    description: "Path of the repository to scan"
    default: "."
  level:
    description: "Compliance level 1, 2 or 3 (default: from csef.yaml)"
    default: ""
  fail-on:
    description: "block | review | warn | never"
    default: "block"
  out-dir:
    description: "Where to write report.md, improvements.md, findings.json and findings.sarif"
    default: "csef-report"
  packs:
    description: "Space-separated extra pack files"
    default: ""
  export:
    description: "Extra outputs: comma-separated html,pdf,docx (dashboard.html, report.pdf, report.docx)"
    default: "html"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - shell: bash
      env:
        CSEF_EXPORT: ${{ inputs.export }}
      run: |
        pip install --quiet pyyaml
        case "$CSEF_EXPORT" in *docx*) pip install --quiet python-docx ;; esac
    - shell: bash
      env:
        CSEF_LEVEL: ${{ inputs.level }}
        CSEF_PACKS: ${{ inputs.packs }}
        CSEF_EXPORT: ${{ inputs.export }}
      run: |
        args=(--repo "${{ inputs.repo }}" --out-dir "${{ inputs.out-dir }}" --fail-on "${{ inputs.fail-on }}")
        if [ -n "$CSEF_LEVEL" ]; then args+=(--level "$CSEF_LEVEL"); fi
        for p in $CSEF_PACKS; do args+=(--pack "$p"); done
        if [ -n "$CSEF_EXPORT" ]; then args+=(--export "$CSEF_EXPORT"); fi
        set +e
        python3 "${{ github.action_path }}/tooling/scan.py" "${args[@]}"
        code=$?
        if [ -f "${{ inputs.out-dir }}/report.md" ]; then cat "${{ inputs.out-dir }}/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
