[project]
name = "sfe"
version = "0.3.0"
description = "Safety Framework Engine: validation, catalogue generation and pattern scanning shared by CSEF and HDSF"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = {text = "Apache-2.0"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sfe"]
